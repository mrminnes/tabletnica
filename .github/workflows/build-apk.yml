name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # позволяет запускать сборку вручную кнопкой во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest   # на серверах GitHub уже установлен Android SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: App icon, splash and notification icon
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1F6B4E' --iconBackgroundColorDark '#1F6B4E' \
            --splashBackgroundColor '#EDF2EE' --splashBackgroundColorDark '#0E1714'
          cp -r android-res/* android/app/src/main/res/

      - name: Home screen widget (native code + manifest)
        run: |
          cp -r android-src/* android/app/src/main/java/
          python3 - << 'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          receiver = (
              '        <receiver android:name=".TodayWidget" android:exported="false" android:label="@string/widget_name">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              '            </intent-filter>\n'
              '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_today_info" />\n'
              '        </receiver>\n'
          )
          s = s.replace('</application>', receiver + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -c "TodayWidget" android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA-256" || true

      - name: Allow exact alarms + deep links (medapp://)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>|' $M
          python3 - << 'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          filt = (
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.VIEW" />\n'
              '                <category android:name="android.intent.category.DEFAULT" />\n'
              '                <category android:name="android.intent.category.BROWSABLE" />\n'
              '                <data android:scheme="medapp" />\n'
              '            </intent-filter>\n'
          )
          s = s.replace('</activity>', filt + '        </activity>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -c "medapp" $M
          grep -c "USE_EXACT_ALARM" $M

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prinyato-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
