<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F8F4">
<title>Принято</title>
<style>
  @font-face{ font-family:'Manrope'; font-style:normal; font-weight:400 800; font-display:swap;
    src:url(fonts/manrope-cyrillic.woff2) format('woff2');
    unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face{ font-family:'Manrope'; font-style:normal; font-weight:400 800; font-display:swap;
    src:url(fonts/manrope-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }

  /* Светлая тема: аптечная зелень на холодном шалфейном фоне */
  :root{
    color-scheme:light;
    --bg:#EDF2EE; --card:#FFFFFF; --sunk:#E2EAE4; --ink:#14231C; --mute:#5A6C63;
    --green:#1F6B4E; --green-soft:#DCEBE2; --on-accent:#FFFFFF;
    --amber:#A86A06; --amber-soft:#F6EAD3; --coral:#B83A25; --coral-soft:#F7E1DA; --line:#D9E3DC;
    --shadow:0 1px 2px rgba(20,35,28,.05), 0 4px 14px rgba(20,35,28,.06);
  }
  /* Тёмная тема: глубокий хвойный, мятный акцент */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0E1714; --card:#15211D; --sunk:#1B2A25; --ink:#E4EEE9; --mute:#8DA197;
      --green:#5ED3A3; --green-soft:#1D3A30; --on-accent:#08130F;
      --amber:#F0B44C; --amber-soft:#3A2E17; --coral:#FF8A73; --coral-soft:#3A201B; --line:#23332D;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1714; --card:#15211D; --sunk:#1B2A25; --ink:#E4EEE9; --mute:#8DA197;
    --green:#5ED3A3; --green-soft:#1D3A30; --on-accent:#08130F;
    --amber:#F0B44C; --amber-soft:#3A2E17; --coral:#FF8A73; --coral-soft:#3A201B; --line:#23332D;
    --shadow:none;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:'Manrope', system-ui, -apple-system, sans-serif; font-weight:500;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--green); outline-offset:2px; }
  #screen{ flex:1; padding:24px 18px 176px; animation:rise .3s ease both; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
  @keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  @media (prefers-reduced-motion: reduce){ #screen, .pill-btn.popping{ animation:none } }

  h1{ margin:2px 0 6px; font-size:27px; font-weight:800; letter-spacing:-.6px; line-height:1.15; }
  .date{ margin:0; color:var(--mute); font-weight:600; font-size:14px; }
  .sub{ margin:0 0 18px; color:var(--mute); font-size:15px; font-weight:600; }

  /* Блистер: прогресс дня — одна ячейка на приём, выдавленная = принято */
  .progress{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:12px 0 18px; }
  .blister{
    display:flex; flex-wrap:wrap; gap:6px; padding:9px 10px;
    background:var(--sunk); border-radius:14px; max-width:100%;
  }
  .blister i{
    width:30px; height:16px; border-radius:99px; display:block;
    background:var(--card); box-shadow:inset 0 0 0 1.5px var(--line);
  }
  .blister i.on{ background:var(--c); box-shadow:inset 0 -3px 0 rgba(0,0,0,.14); }
  .blister-cap{ margin:0; color:var(--mute); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }

  .week{ display:flex; gap:6px; margin-bottom:20px; }
  .wday{
    flex:1; border-radius:14px; padding:9px 0 7px; text-align:center; cursor:pointer;
    background:var(--card); border:1.5px solid var(--line); transition:transform .2s, border-color .2s;
  }
  .wday.today{ background:var(--green); border-color:var(--green); }
  .wday.sel{ transform:translateY(-3px); border-color:var(--green); }
  .wday .lbl{ font-size:11px; font-weight:700; color:var(--mute); }
  .wday .num{ font-size:15px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .wday.today .lbl, .wday.today .num{ color:var(--on-accent); }
  .dots{ display:flex; gap:2px; justify-content:center; margin-top:3px; min-height:4px; }
  .dots span{ width:4px; height:4px; border-radius:99px; background:var(--line); }
  .wday.today .dots span{ background:var(--on-accent); opacity:.45; }

  .card{
    background:var(--card); border-radius:20px; padding:14px; margin-bottom:10px;
    display:flex; align-items:center; gap:14px; border:1.5px solid transparent;
    box-shadow:var(--shadow); transition:border-color .25s, opacity .25s;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card{ border-color:var(--line); } }
  :root[data-theme="dark"] .card{ border-color:var(--line); }
  .card.taken{ opacity:.6; box-shadow:none; background:transparent; border:1.5px dashed var(--line); }
  .card.soon{ border-color:var(--amber) !important; }
  .card.missed{ border-color:var(--coral-soft) !important; }
  .card[data-take]{ cursor:pointer; }
  .card.flash{ border-color:var(--amber) !important; box-shadow:0 0 0 3px var(--amber-soft); }
  .pill-btn{
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--sunk); flex-shrink:0; display:grid; place-items:center;
  }
  .pill-btn.done{ background:var(--green); }
  .pill-btn.locked{ cursor:default; opacity:.55; }
  .pill-btn.popping{ animation:pop .45s ease; }
  .pill-btn .check{ width:22px; height:22px; color:var(--on-accent); }
  .pill-shape{
    display:inline-block; width:26px; height:14px; border-radius:99px;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);
  }
  .card .info{ flex:1; min-width:0; }
  .pill-ico{ display:block; flex-shrink:0; }
  .file-btn{ display:block; text-align:center; }
  .help-link{ width:100%; margin-top:12px; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .help-link .chev{ font-size:26px; color:var(--mute); }
  .faq{ padding:4px 16px; }
  .faq details{ border-top:1px solid var(--line); }
  .faq details:first-child{ border-top:none; }
  .faq summary{ padding:14px 0; font-weight:700; font-size:15.5px; cursor:pointer; list-style:none;
    display:flex; justify-content:space-between; gap:12px; }
  .faq summary::-webkit-details-marker{ display:none; }
  .faq summary::after{ content:"+"; color:var(--mute); font-weight:600; font-size:20px; line-height:1; }
  .faq details[open] summary::after{ content:"−"; }
  .faq p{ margin:0 0 14px; color:var(--mute); font-size:14.5px; line-height:1.5; font-weight:500; }
  .as-link{ display:block; text-align:center; text-decoration:none; box-sizing:border-box; }
  .strength{ font-weight:600; color:var(--mute); font-size:15px; }
  .form-chips .chip{ display:inline-flex; align-items:center; gap:6px; }
  .med-name{ font-weight:700; font-size:17px; letter-spacing:-.2px; }
  .med-dose{ font-size:14px; color:var(--mute); font-weight:500; }
  .low-badge{
    margin-top:5px; display:inline-block; background:var(--coral-soft); color:var(--coral);
    font-size:12.5px; font-weight:700; border-radius:8px; padding:2px 8px;
  }
  .card .right{ text-align:right; flex-shrink:0; }
  .time{ font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; }
  .time.soon{ color:var(--amber); }
  .status{ font-size:12.5px; color:var(--mute); font-weight:600; }
  .status.taken-at{ color:var(--green); }
  .status.miss{ color:var(--coral); }

  .empty{
    border-radius:20px; padding:30px 24px; text-align:center;
    border:1.5px dashed var(--line);
  }
  .empty .pill-shape{ width:44px; height:22px; background:var(--green-soft); box-shadow:none; }
  .empty p{ margin:12px 0 4px; font-weight:700; }
  .empty .hint{ color:var(--mute); font-size:14px; font-weight:500; margin:0; }

  .meta{ font-size:13.5px; color:var(--mute); font-weight:500; line-height:1.45; margin-top:2px; }
  .stock-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .stock-bar{ height:6px; border-radius:99px; background:var(--sunk); overflow:hidden; }
  .stock-bar div{ height:100%; background:var(--green); border-radius:99px; transition:width .3s; }
  .stock-bar.low div{ background:var(--coral); }
  .med-actions{ display:flex; gap:8px; margin-top:14px; }
  .btn-small{
    flex:1; padding:11px 0; border-radius:12px; font-weight:700; font-size:13.5px; cursor:pointer;
    border:1.5px solid var(--line); background:transparent; color:var(--mute);
  }
  .btn-small.primary{ border-color:var(--green); color:var(--green); }
  .btn-small.danger{ border-color:transparent; color:var(--coral); flex:.7; }

  label{ font-size:13.5px; font-weight:700; color:var(--mute); margin:18px 0 6px; display:block; }
  .hint-line{ font-size:12.5px; color:var(--mute); font-weight:500; margin:6px 0 0; line-height:1.45; }
  .inp{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--line);
    font-size:16px; font-weight:600; color:var(--ink); background:var(--card); outline:none;
  }
  .inp:focus{ border-color:var(--green); }
  .time-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .time-row .inp.t{ flex:1.6; }
  .time-row .inp.n{ flex:1; }
  .time-row .del{
    width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--card); color:var(--coral); font-weight:800; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .link-btn{ border:none; background:none; color:var(--green); font-weight:700; font-size:14px; cursor:pointer; padding:0; }
  .day-chips{ display:flex; gap:6px; }
  .day-chip, .chip{
    flex:1; padding:11px 0; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer;
    border:1.5px solid var(--line); background:var(--card); color:var(--mute);
  }
  .chip{ padding:12px 0; font-size:14px; border-radius:14px; }
  .day-chip.on, .chip.on{ border-color:var(--green); background:var(--green); color:var(--on-accent); }
  .chips2{ display:flex; gap:8px; }
  .chips-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .chips-wrap .chip{ flex:none; padding:10px 14px; font-size:13.5px; }
  .cyc-row{ display:flex; gap:8px; margin-top:8px; }
  .cyc-row > div{ flex:1; }
  .cyc-row .cap{ font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; }
  .strip{ display:flex; gap:3px; margin-top:8px; }
  .strip div{
    flex:1; border-radius:8px; padding:5px 0; text-align:center; font-size:11px; font-weight:700;
    background:var(--card); border:1.5px solid var(--line); color:var(--mute);
  }
  .strip div.on{ background:var(--green); border-color:var(--green); color:var(--on-accent); }
  .section-title{ font-size:14px; font-weight:700; color:var(--mute); margin:20px 0 8px; }
  .btn-extra{
    width:100%; margin-top:8px; padding:13px 0; border-radius:16px; cursor:pointer;
    border:1.5px dashed var(--line); background:none; color:var(--green); font-weight:700; font-size:14.5px;
  }
  .btn-main{
    width:100%; margin-top:24px; padding:16px 0; border-radius:16px; border:none;
    background:var(--green); color:var(--on-accent); font-weight:800; font-size:16.5px; cursor:pointer;
  }
  .btn-main:disabled{ background:var(--sunk); color:var(--mute); cursor:not-allowed; }
  .btn-ghost{
    width:100%; margin-top:8px; padding:10px 0; border:none; background:none;
    color:var(--mute); font-weight:600; font-size:14px; cursor:pointer;
  }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
    background:var(--green-soft); color:var(--green); font-weight:800; font-size:16px;
  }
  .panel-title{ font-weight:700; font-size:15.5px; margin-bottom:4px; }

  /* Дневник */
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stats div{ background:var(--card); border-radius:16px; padding:12px 10px; box-shadow:var(--shadow); }
  .stats b{ display:block; font-size:24px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .stats span{ display:block; font-size:12px; color:var(--mute); font-weight:600; line-height:1.3; margin-top:2px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:16px; margin-bottom:8px; }
  .cal-nav{ width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:none;
    color:var(--ink); font-size:20px; font-weight:700; cursor:pointer; }
  .cal-nav:disabled{ opacity:.3; cursor:default; }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow span{ text-align:center; font-size:11px; font-weight:700; color:var(--mute); padding-bottom:4px; }
  .cal button{ aspect-ratio:1; border:none; border-radius:10px; background:transparent; cursor:pointer;
    font-weight:700; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums; padding:0; }
  .cal button.full{ background:var(--green); color:var(--on-accent); }
  .cal button.part{ background:var(--amber-soft); color:var(--amber); }
  .cal button.miss{ background:var(--coral-soft); color:var(--coral); }
  .cal button.none{ color:var(--mute); }
  .cal button.future{ color:var(--mute); opacity:.45; }
  .cal button.today{ box-shadow:inset 0 0 0 2px var(--ink); }
  .cal-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--mute); font-weight:600; }
  .cal-legend span{ display:flex; align-items:center; gap:5px; }
  .cal-legend i{ width:12px; height:12px; border-radius:4px; display:inline-block; }
  .cal-legend i.full{ background:var(--green); } .cal-legend i.part{ background:var(--amber-soft); box-shadow:inset 0 0 0 1.5px var(--amber); }
  .cal-legend i.miss{ background:var(--coral-soft); box-shadow:inset 0 0 0 1.5px var(--coral); }
  .vitals{ padding:6px 14px; }
  .v-day{ font-size:12.5px; font-weight:700; color:var(--mute); padding:10px 0 4px; }
  .v-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .v-day + .v-row{ border-top:none; }
  .v-time{ font-size:13px; color:var(--mute); font-weight:600; font-variant-numeric:tabular-nums; width:42px; }
  .v-name{ flex:1; font-weight:600; font-size:14.5px; min-width:0; }
  .v-name small{ display:block; color:var(--mute); font-size:12.5px; font-weight:500; }
  .v-row b{ font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .v-del{ width:32px; height:32px; border:none; background:none; color:var(--mute); font-size:20px; cursor:pointer; border-radius:8px; }

  /* Нижняя зона: кнопка «Отправить» слева, «+» справа — не перекрывают друг друга */
  #sendbar{
    position:fixed; left:14px; right:86px; z-index:16;
    bottom:calc(86px + env(safe-area-inset-bottom));
  }
  #sendbar button{
    width:100%; height:58px; border-radius:18px; border:none; cursor:pointer;
    background:var(--ink); color:var(--bg); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #sendbar svg{ width:18px; height:18px; }
  #fab{
    position:fixed; right:14px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:15;
    width:58px; height:58px; border-radius:18px; border:none; background:var(--green); color:var(--on-accent);
    cursor:pointer; display:grid; place-items:center;
    box-shadow:0 6px 16px rgba(20,35,28,.22);
  }
  #fab svg{ width:26px; height:26px; }
  #nav{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); display:flex; z-index:10;
    padding:8px 0 calc(10px + env(safe-area-inset-bottom));
  }
  #nav button{
    flex:1; border:none; background:none; cursor:pointer; padding:4px 0;
    color:var(--mute); font-weight:700; font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  #nav .icon{ width:44px; height:28px; border-radius:99px; display:grid; place-items:center; transition:background .2s; }
  #nav .icon svg{ width:22px; height:22px; }
  #nav button.active{ color:var(--ink); }
  #nav button.active .icon{ background:var(--green-soft); color:var(--green); }
</style>
</head>
<body>
  <div id="screen"></div>
  <div id="sendbar" style="display:none"></div>
  <button id="fab" aria-label="Добавить лекарство"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="nav">
    <button data-nav="today"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>Сегодня</button>
    <button data-nav="meds"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/></svg></div>Лекарства</button>
    <button data-nav="diary"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg></div>Дневник</button>
    <button data-nav="people"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg></div>Люди</button>
  </div>

<script>
"use strict";
// ─── Константы ───
var ICON_CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>';
// Форма лекарства: название, единица счёта и иконка
var FORMS = {
  tablet:    { name: "Таблетка", unit: "шт" },
  capsule:   { name: "Капсула",  unit: "шт" },
  drops:     { name: "Капли",    unit: "кап." },
  liquid:    { name: "Сироп",    unit: "мл" },
  injection: { name: "Укол",     unit: "мл" },
  sachet:    { name: "Порошок",  unit: "пак." },
  spray:     { name: "Спрей",    unit: "доз" },
};
function formOf(m) { return FORMS[m && m.form] ? m.form : "tablet"; }
function unitOf(m) { return FORMS[formOf(m)].unit; }
function pillIcon(m, size) {
  var c = esc((m && m.color) || "#7FB69B"), sz = size || 28, sh = "rgba(0,0,0,.14)", body;
  switch (formOf(m)) {
    case "capsule": body = '<g transform="rotate(-35 14 14)"><rect x="3" y="9" width="22" height="10" rx="5" fill="' + c + '"/><path d="M14 9h6a5 5 0 0 1 0 10h-6z" fill="#fff" opacity=".55"/></g>'; break;
    case "drops": body = '<path d="M14 3c4 5 7 9 7 13a7 7 0 0 1-14 0c0-4 3-8 7-13z" fill="' + c + '"/>'; break;
    case "liquid": body = '<rect x="10" y="3" width="8" height="4" rx="1.5" fill="' + sh + '"/><path d="M9 8h10l1 3v12a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V11z" fill="' + c + '"/>'; break;
    case "injection": body = '<g transform="rotate(45 14 14)"><rect x="10.5" y="6" width="7" height="14" rx="1.5" fill="' + c + '"/><path d="M14 20v6M10 5h8M14 2v3" stroke="' + c + '" stroke-width="2" stroke-linecap="round"/></g>'; break;
    case "sachet": body = '<rect x="5" y="5" width="18" height="18" rx="3" fill="' + c + '"/><path d="M5 9h18" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 2" opacity=".7"/>'; break;
    case "spray": body = '<rect x="9" y="10" width="10" height="15" rx="3" fill="' + c + '"/><rect x="11.5" y="4" width="5" height="6" rx="1" fill="' + c + '"/><path d="M19 5h3" stroke="' + c + '" stroke-width="2" stroke-linecap="round"/>'; break;
    default: body = '<circle cx="14" cy="14" r="10" fill="' + c + '"/><path d="M8 14h12" stroke="' + sh + '" stroke-width="2" stroke-linecap="round"/>';
  }
  return '<svg class="pill-ico" width="' + sz + '" height="' + sz + '" viewBox="0 0 28 28" aria-hidden="true">' + body + '</svg>';
}
var PILL_COLORS = ["#7FB69B", "#E8A13C", "#8FA8D9", "#D98FB0", "#B69B7F"];
var DAY_NAMES = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
var REMIND_OPTS = [
  { v: 0, l: "В момент приёма" }, { v: 10, l: "За 10 мин" }, { v: 30, l: "За 30 мин" },
  { v: 60, l: "За 1 час" }, { v: 120, l: "За 2 часа" }
];

// ─── Даты ───
function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function stripTime(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function diffDays(a, b) { return Math.round((stripTime(b) - stripTime(a)) / 86400000); }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dayIdx(d) { return (d.getDay() + 6) % 7; } // ПН = 0
function round2(x) { return Math.round(x * 100) / 100; }
function num(v) { var x = parseFloat(String(v).replace(",", ".")); return isFinite(x) && x > 0 ? round2(x) : 1; }
function fmtN(n) { return String(n).replace(".", ","); }

// ─── Настройки ───
function cfgGet(k, d) { try { var v = localStorage.getItem("cfg:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function cfgSet(k, v) { localStorage.setItem("cfg:" + k, JSON.stringify(v)); }

// ─── Профили (карточки людей) ───
// Всё лежит только на телефоне. Никакого сервера, никаких аккаунтов.
// self  — мой профиль: после отметки предлагаем поделиться с близким
// watch — профиль другого человека: сторожевое напоминание, если приём не подтверждён
function loadProfiles() {
  try { var p = JSON.parse(localStorage.getItem("profiles")); if (p && p.length) return p; } catch (e) {}
  return [{ id: "self", name: "Я", self: true, remind: true, watch: false, share: true, graceMin: 60 }];
}
function saveProfiles(p) { localStorage.setItem("profiles", JSON.stringify(p)); }

// ─── Оформление: авто (как в системе) / светлая / тёмная ───
var THEMES = [["auto", "Авто"], ["light", "Светлая"], ["dark", "Тёмная"]];
function applyTheme() {
  var t = cfgGet("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
}
applyTheme();
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", applyTheme);
}

var profiles = loadProfiles();
var curPid = cfgGet("last_profile", "");
if (!profiles.some(function (p) { return p.id === curPid; })) curPid = profiles[0].id;

function curProfile() {
  return profiles.find(function (p) { return p.id === curPid; }) || profiles[0];
}

// ─── Хранилище (в разрезе профиля) ───
function medsOf(pid) { try { return JSON.parse(localStorage.getItem("meds:" + pid)) || []; } catch (e) { return []; } }
function takenOf(pid, key) { try { return JSON.parse(localStorage.getItem("taken:" + pid + ":" + key)) || {}; } catch (e) { return {}; } }

function loadMeds() { return medsOf(curPid); }
function saveMeds(m) { localStorage.setItem("meds:" + curPid, JSON.stringify(m)); }
function loadTakenFor(key) { return takenOf(curPid, key); }
function saveTakenFor(key, t) { localStorage.setItem("taken:" + curPid + ":" + key, JSON.stringify(t)); }

// Миграция с версий без профилей: всё, что было, становится профилем «Я»
(function migrateToProfiles() {
  if (localStorage.getItem("meds") !== null) {
    localStorage.setItem("meds:self", localStorage.getItem("meds"));
    localStorage.removeItem("meds");
  }
  var moves = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    // старый формат: taken:2026-07-23 (ровно одна часть после префикса)
    if (k && k.indexOf("taken:") === 0 && k.split(":").length === 2) moves.push(k);
  }
  moves.forEach(function (k) {
    localStorage.setItem("taken:self:" + k.slice(6), localStorage.getItem(k));
    localStorage.removeItem(k);
  });
  if (localStorage.getItem("profiles") === null) saveProfiles(profiles);
})();

// Чистим отметки старше 400 дней — год истории для дневника и врача
(function cleanup() {
  var limit = new Date(); limit.setDate(limit.getDate() - 400);
  for (var i = localStorage.length - 1; i >= 0; i--) {
    var k = localStorage.key(i);
    var parts = k ? k.split(":") : [];
    if (parts[0] === "taken" && parts.length === 3 && parts[2] < dateKey(limit)) localStorage.removeItem(k);
  }
})();

// ─── Состояние ───
var meds = loadMeds();
var screen = "today";
var selectedKey = dateKey();   // выбранный день в недельной ленте
var justTaken = null;
var highlightKey = null;       // карточка, в которую «провалились» из уведомления
var notifInfo = { supported: false, count: 0, next: null, exact: "unknown" };
var personEditId = null;

// Миграция данных из версии 1.0 (не теряем уже введённые лекарства)
(function migrate() {
  var changed = false;
  meds = meds.map(function (m) {
    var nm = Object.assign({}, m);
    if (nm.times.length && typeof nm.times[0] === "string") {
      var n = 1, note = nm.dose || "";
      var match = /^(\d+)\s*(.*)$/.exec(note);
      if (match) { n = Math.max(1, +match[1]); note = match[2]; }
      nm.times = nm.times.map(function (t) { return { t: t, n: n }; });
      nm.doseNote = note; delete nm.dose; changed = true;
    }
    if (!nm.mode) { nm.mode = "weekly"; changed = true; }
    if (!nm.start) { nm.start = dateKey(); changed = true; }
    if (nm.every == null) { nm.every = 2; changed = true; }
    if (nm.remindOffsets == null) { nm.remindOffsets = [nm.remindBefore || 0]; delete nm.remindBefore; changed = true; }
    if (nm.doseNote == null) nm.doseNote = "";
    if (nm.lineage == null) { nm.lineage = nm.id; changed = true; }
    if (nm.until === undefined) { nm.until = null; changed = true; }
    return nm;
  });
  if (changed) saveMeds(meds);
})();

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// ─── Расписание: принимается ли лекарство в конкретную дату ───
function occursOn(m, date) {
  if (m.until && dateKey(date) >= m.until) return false; // версия заменена новой
  var diff = diffDays(parseKey(m.start), date);
  if (diff < 0) return false;
  if (m.courseDays && diff >= m.courseDays) return false;
  // Цикл: onDays дней приёма, затем перерыв, полная длина цикла — every
  if (m.mode === "interval") return diff % Math.max(1, m.every) < Math.max(1, m.onDays || 1);
  return m.days.indexOf(dayIdx(date)) !== -1;
}

// ─── Версии одного лекарства ───
// Правки «с будущей даты» создают новую версию, старая закрывается полем until.
// Запас общий для всех версий и хранится в корневой записи (id === lineage).
function linOf(m) { return m.lineage || m.id; }
function famOf(lin) {
  return meds.filter(function (x) { return linOf(x) === lin; })
             .sort(function (a, b) { return a.start.localeCompare(b.start); });
}
function holderOf(m) {
  var root = meds.find(function (x) { return x.id === linOf(m); });
  return root || m;
}
function activeVersions(lin) {
  var today = dateKey();
  return famOf(lin).filter(function (x) { return !x.until || x.until > today; });
}

function intakesFor(date) {
  var list = [];
  meds.forEach(function (m) {
    if (occursOn(m, date)) m.times.forEach(function (tm) {
      list.push({ med: m, time: tm.t, n: tm.n, key: m.id + "@" + tm.t });
    });
  });
  return list.sort(function (a, b) { return a.time.localeCompare(b.time); });
}

function schedText(m) {
  if (m.mode === "interval") {
    var on = Math.max(1, m.onDays || 1), off = Math.max(0, m.every - on);
    if (off === 0) return "каждый день";
    if (on === 1) return off === 1 ? "через день" : "каждые " + m.every + " дн.";
    return on + " через " + off + " (" + on + " дн. приём, " + off + " дн. перерыв)";
  }
  return m.days.length === 7 ? "каждый день" : m.days.map(function (d) { return DAY_NAMES[d]; }).join(" ");
}

function remindText(m) {
  var o = m.remindOffsets || [];
  if (!o.length) return "без напоминаний";
  return "напомнит: " + o.map(function (v) {
    if (v === 0) return "в момент";
    if (v % 60 === 0) return "за " + (v / 60) + " ч";
    return "за " + v + " мин";
  }).join(", ");
}

// ─── Экран «Сегодня» (с просмотром любого дня недели) ───
// Переключатель людей — на экранах «Сегодня» и «Дневник»
function profileSwitcher() {
  return profiles.length > 1
    ? '<div class="chips-wrap" style="margin-bottom:12px">' + profiles.map(function (p) {
        return '<button class="chip' + (p.id === curPid ? " on" : "") + '" data-pid="' + esc(p.id) + '">' +
          esc(p.name) + '</button>';
      }).join("") + '</div>'
    : '';
}

function renderToday() {
  var todayK = dateKey();
  var selDate = parseKey(selectedKey);
  var isToday = selectedKey === todayK;
  var isFuture = selectedKey > todayK;
  var isPast = selectedKey < todayK;
  var nowStr = hhmm(new Date());
  var taken = loadTakenFor(selectedKey);
  var intakes = intakesFor(selDate);
  var done = intakes.filter(function (i) { return taken[i.key]; }).length;
  var extras = extrasOf(taken);

  var dateStr = selDate.toLocaleDateString("ru-RU", isToday
    ? { day: "numeric", month: "long" }
    : { weekday: "long", day: "numeric", month: "long" });

  var title = isToday
    ? (done === intakes.length && intakes.length > 0 ? "Всё принято" : "Пора заботиться о себе")
    : isFuture ? "План на этот день"
    : (intakes.length === 0 ? "Приёмов не было" : done === intakes.length ? "Всё было принято" : "Были пропуски");

  var sub = isFuture ? "Запланировано приёмов: " + intakes.length
    : "Принято: " + done + " из " + intakes.length +
      (extras.length ? " · вне расписания: " + extras.length : "");

  // Недельная лента: ПН–ВС текущей недели, все дни кликабельны
  var monday = stripTime(new Date());
  monday.setDate(monday.getDate() - dayIdx(monday));
  var week = "";
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday); d.setDate(monday.getDate() + i);
    var k = dateKey(d);
    var cnt = Math.min(intakesFor(d).length, 4), dots = "";
    for (var j = 0; j < cnt; j++) dots += "<span></span>";
    week += '<div class="wday' + (k === todayK ? " today" : "") + (k === selectedKey ? " sel" : "") + '" data-date="' + k + '" role="button">' +
      '<div class="lbl">' + DAY_NAMES[i] + '</div><div class="num">' + d.getDate() + '</div><div class="dots">' + dots + '</div></div>';
  }

  var switcher = profileSwitcher();

  var html = switcher + '<p class="date">' + esc(dateStr) + '</p>' +
    '<h1>' + title + '</h1>' +
    (intakes.length && !isFuture
      ? '<div class="progress"' + (isToday ? '' : ' style="margin-bottom:6px"') + '><div class="blister" aria-hidden="true">' + intakes.map(function (it) {
          return '<i' + (taken[it.key] ? ' class="on"' : '') + ' style="--c:' + esc(it.med.color) + '"></i>';
        }).join("") + '</div><p class="blister-cap">' + sub + '</p></div>'
      : '<p class="sub" style="margin-bottom:' + (isToday ? '18' : '6') + 'px">' + sub + '</p>') +
    (!isToday ? '<p style="margin:0 0 14px"><button class="link-btn" id="back-today">← вернуться к сегодня</button></p>' : '') +
    '<div class="week">' + week + '</div>';

  if (intakes.length === 0 && !extras.length) {
    html += '<div class="empty"><span class="pill-shape"></span><p>' + (isToday ? "На сегодня приёмов нет" : "В этот день приёмов нет") + '</p>' +
      (meds.length === 0 ? '<p class="hint">Добавь первое лекарство кнопкой «+»</p>' : '') + '</div>';
  }

  intakes.forEach(function (it) {
    var rec = taken[it.key], isTaken = !!rec;
    var soon = isToday && !isTaken && it.time <= nowStr;
    var missed = isPast && !isTaken;
    var doseLine = fmtN(it.n) + " " + unitOf(it.med) + (it.med.strength ? " · " + esc(it.med.strength) : "") +
      (it.med.doseNote ? " · " + esc(it.med.doseNote) : "");
    var cardCls = (isTaken ? " taken" : missed ? " missed" : soon ? " soon" : "") +
      (it.key === highlightKey && !isTaken ? " flash" : "");

    var btn;
    if (isFuture) {
      btn = '<button class="pill-btn locked" tabindex="-1" aria-hidden="true">' + pillIcon(it.med) + '</button>';
    } else {
      btn = '<button class="pill-btn' + (isTaken ? " done" : "") + (justTaken === it.key ? " popping" : "") + '" tabindex="-1" aria-hidden="true">' +
        (isTaken ? ICON_CHECK : pillIcon(it.med)) +
        '</button>';
    }

    var status;
    if (isTaken) status = '<div class="status taken-at">' +
      (rec.via === "link" ? "отмечено по ссылке" : rec.retro ? "отмечено позже" : "выпил в " + esc(rec.at)) +
      (rec.sent ? " · отправлено" : "") + '</div>';
    else if (isFuture) status = '<div class="status">запланировано</div>';
    else if (missed) status = '<div class="status miss">пропущено — нажми, если пил</div>';
    else status = '<div class="status">' + (soon ? "пора!" : "позже") + '</div>';

    html +=
      '<div class="card' + cardCls + '" data-key="' + esc(it.key) + '"' +
        (!isFuture ? ' data-take="' + esc(it.key) + '" role="button" aria-label="' +
          (isTaken ? "Принято, нажми чтобы отменить" : "Отметить приём: " + esc(it.med.name)) + '"' : '') + '>' +
        btn +
        '<div class="info">' +
          '<div class="med-name">' + esc(it.med.name) + '</div>' +
          '<div class="med-dose">' + doseLine + '</div>' +
          (isToday && holderOf(it.med).stock <= 5 && !isTaken ? '<div class="low-badge">Осталось ' + fmtN(holderOf(it.med).stock) + ' ' + unitOf(it.med) + ' — пора купить</div>' : '') +
        '</div>' +
        '<div class="right"><div class="time' + (soon ? " soon" : "") + '">' + esc(it.time) + '</div>' + status + '</div>' +
      '</div>';
  });

  if (extras.length) {
    html += '<div class="section-title">Вне расписания</div>';
    extras.forEach(function (x) {
      var r = x.rec;
      html +=
        '<div class="card taken" data-extra="' + esc(x.key) + '" role="button" aria-label="Приём вне расписания: ' + esc(r.name) + ', нажми чтобы удалить">' +
          '<button class="pill-btn done" tabindex="-1" aria-hidden="true">' + ICON_CHECK + '</button>' +
          '<div class="info">' +
            '<div class="med-name" style="text-decoration:none">' + esc(r.name) + '</div>' +
            '<div class="med-dose">' + fmtN(r.n) + ' шт' + (r.note ? ' · ' + esc(r.note) : '') + '</div>' +
          '</div>' +
          '<div class="right"><div class="time">' + esc(r.at) + '</div>' +
            '<div class="status taken-at">' + (r.via === "link" ? "отмечено по ссылке" : "вне расписания") +
            (r.sent ? " · отправлено" : "") + '</div></div>' +
        '</div>';
    });
  }

  if (!isFuture) {
    html += '<button class="btn-extra" id="add-extra">+ Выпил вне расписания</button>';
  }
  return html;
}

// Приёмы вне расписания хранятся в той же записи дня под ключами «x:…»
function extrasOf(taken) {
  return Object.keys(taken)
    .filter(function (k) { return k.indexOf("x:") === 0 && taken[k] && taken[k].extra; })
    .map(function (k) { return { key: k, rec: taken[k] }; })
    .sort(function (a, b) { return String(a.rec.at).localeCompare(String(b.rec.at)); });
}

// ─── Экран «Приём вне расписания» ───
var extraForm = null;
function blankExtra() {

}

  }).join("");

    (chips ? '<label>Из моих лекарств</label><div class="chips-wrap">' + chips + '</div>' +
      '<p class="hint-line">Выбранное лекарство спишется из запаса</p>' : '') +

    '<button class="btn-ghost" id="x-cancel">Отмена</button>';
}
function extraValid() { return !!(extraForm.lin || extraForm.name.trim()); }
function readExtra() {
  var g = function (id) { return document.getElementById(id); };
  if (g("x-name") && !extraForm.lin) extraForm.name = g("x-name").value;
  if (g("x-n")) extraForm.n = num(g("x-n").value);

// ─── Экран «Мои лекарства» ───
function renderMeds() {
  var html = '<h1 style="margin-bottom:16px">Мои лекарства</h1>';

  if (notifInfo.supported) {
    var ok = notifInfo.exact === "granted";
    html += '<div class="card" style="display:block; border-color:' + (ok ? "var(--line)" : "var(--coral)") + '">' +
      '<div class="panel-title">Напоминания</div>' +
      '<div style="font-size:13.5px; color:var(--mute); font-weight:600">' +
        (notifInfo.count > 0
          ? "Запланировано: " + notifInfo.count +
            (notifInfo.next ? "<br>Ближайшее: " + esc(notifInfo.next) : "")

// Превью цикла на две недели вперёд от даты начала (или от сегодня, если старт уже был)
function cycleStrip(f) {
  var start = parseKey(f.start || dateKey());
  var from = stripTime(new Date());
  if (start > from) from = start;
  var cells = "";
  for (var i = 0; i < 14; i++) {
    var d = new Date(from); d.setDate(from.getDate() + i);
    var on = occursOn({ mode: "interval", start: f.start || dateKey(), every: f.on + f.off, onDays: f.on, until: null, courseDays: null }, d);
    cells += '<div class="' + (on ? "on" : "") + '">' + d.getDate() + '</div>';
  }
  return '<div class="strip">' + cells + '</div>' +
    '<p class="hint-line">Ближайшие 2 недели: зелёным — дни приёма</p>';
}
function formValid() {

}

  pulse:  { name: "Пульс",       unit: "уд/мин",     ph: ["70"] },

  weight: { name: "Вес",         unit: "кг",         ph: ["70"] },
  temp:   { name: "Температура", unit: "°C",         ph: ["36,6"] },
};
var MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль",
              "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

function vitalsOf(pid) { try { return JSON.parse(localStorage.getItem("vitals:" + pid)) || []; } catch (e) { return []; } }
function saveVitals(v) { localStorage.setItem("vitals:" + curPid, JSON.stringify(v)); }
function vitalVal(s) { var x = parseFloat(String(s).replace(",", ".")); return isFinite(x) && x > 0 ? round2(x) : null; }
function fmtVital(x) {
  var t = VITALS[x.type];
  return (t.two ? fmtN(x.v1) + "/" + fmtN(x.v2) : fmtN(x.v1)) + " " + t.unit;
}

// Сколько приёмов было запланировано в день и сколько отмечено
function dayStat(d) {
  var list = intakesFor(d), t = loadTakenFor(dateKey(d));
  return { plan: list.length, done: list.filter(function (i) { return t[i.key]; }).length };
}

// Соблюдение за N прошедших дней (сегодня не считаем — день ещё идёт)
function adherence(days) {
  var plan = 0, done = 0, missed = 0;
  for (var i = 1; i <= days; i++) {
    var d = stripTime(new Date()); d.setDate(d.getDate() - i);
    var s = dayStat(d);
    plan += s.plan; done += s.done;
    if (s.done < s.plan) missed++;
  }
  return { plan: plan, done: done, missedDays: missed, pct: plan ? Math.round(done / plan * 100) : null };
}

// Серия: дни подряд без пропусков. Дни без приёмов серию не прерывают
function streak() {
  var n = 0, today = stripTime(new Date());
  var t = dayStat(today);
  if (t.plan && t.done === t.plan) n++;
  for (var i = 1; i <= 365; i++) {
    var d = new Date(today); d.setDate(d.getDate() - i);
    var s = dayStat(d);
    if (!s.plan) continue;
    if (s.done < s.plan) break;
    n++;
  }
  return n;
}

function daysWord(n) {
  var a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? "день" : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? "дня" : "дней";
}

function doctorReport() {
  var prof = curProfile(), today = new Date();
  var lines = ["Отчёт о приёме лекарств — " + prof.name, "Дата: " + today.toLocaleDateString("ru-RU"), "", "Лекарства:"];
  var lins = [];
  meds.forEach(function (m) { if (lins.indexOf(linOf(m)) === -1) lins.push(linOf(m)); });
  var any = false;
  lins.forEach(function (lin) {
    var act = activeVersions(lin);
    if (!act.length) return;
    var m = act[0]; any = true;
    lines.push("• " + m.name + (m.strength ? " " + m.strength : "") + ", " + FORMS[formOf(m)].name.toLowerCase() +
      (m.doseNote ? " (" + m.doseNote + ")" : "") + ": " +
      m.times.map(function (x) { return x.t + " — " + fmtN(x.n) + " " + unitOf(m); }).join(", ") + "; " + schedText(m) +
      (m.courseDays ? "; курс " + m.courseDays + " дн." : ""));
  });
  if (!any) lines.push("нет активных");

  var a = adherence(30);
  lines.push("", "Соблюдение за 30 дней: " + (a.pct === null ? "нет запланированных приёмов"
    : a.pct + "% (принято " + a.done + " из " + a.plan + ", дней с пропусками: " + a.missedDays + ")"));

  var from = new Date(); from.setDate(from.getDate() - 30);
  var vit = vitalsOf(curPid).filter(function (x) { return x.at.slice(0, 10) >= dateKey(from); })
    .sort(function (a, b) { return a.at.localeCompare(b.at); });
  if (vit.length) {
    lines.push("", "Показатели за 30 дней:");
    Object.keys(VITALS).forEach(function (t) {
      var rows = vit.filter(function (x) { return x.type === t; });
      if (!rows.length) return;
      lines.push(VITALS[t].name + ", " + VITALS[t].unit + ":");
      rows.forEach(function (x) {
        var d = parseKey(x.at.slice(0, 10));
        lines.push("  " + pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + x.at.slice(11, 16) + " — " +
          (VITALS[t].two ? fmtN(x.v1) + "/" + fmtN(x.v2) : fmtN(x.v1)) + (x.note ? " (" + x.note + ")" : ""));
      });
    });
  }
  return lines.join("\n");
}

// ─── Виджет на рабочем столе ───
// Отдаём нативному виджету приёмы своей карточки на сегодня и завтра.
// Следующий приём и смену дня виджет считает сам по текущему времени.
var widgetTimer = null;
function widgetSync() {
  var W = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TodayWidget;
  if (!W) return;
  clearTimeout(widgetTimer);
  widgetTimer = setTimeout(function () {
    var saved = meds;
    try {
      var prof = profiles.find(function (p) { return p.self; }) || profiles[0];
      meds = medsOf(prof.id);   // intakesFor считает по текущему списку лекарств
      var now = new Date(), tom = new Date(now.getTime() + 86400000);
      var taken = takenOf(prof.id, dateKey(now));
      var row = function (it, ok) { return { t: it.time, nm: it.med.name, ok: ok ? 1 : 0 }; };
      var data = { v: 1, date: dateKey(now),
        today: intakesFor(now).map(function (it) { return row(it, taken[it.key]); }),
        tomorrow: intakesFor(tom).map(function (it) { return row(it, false); }) };
      W.update({ data: JSON.stringify(data) }).catch(function () {});
    } catch (e) {}
    meds = saved;
  }, 300);
}

function render() {
  if (screen === "today") el.innerHTML = renderToday();
  else if (screen === "meds") el.innerHTML = renderMeds();
  else if (screen === "people") el.innerHTML = renderPeople();
  else if (screen === "person") el.innerHTML = renderPerson();
  else if (screen === "add") el.innerHTML = renderAdd();
  else if (screen === "extra") el.innerHTML = renderExtra();
  else if (screen === "diary") el.innerHTML = renderDiary();
  else if (screen === "help") el.innerHTML = renderHelp();

  var isForm = screen === "add" || screen === "extra";
  fab.style.display = isForm || screen === "help" ? "none" : "grid";
  nav.style.display = isForm ? "none" : "flex";

  // Панель «отправить близкому» — только на своём профиле, где включён обмен
  var bar = document.getElementById("sendbar");
  var prof = curProfile();
  var pend = (screen === "today" && prof.share) ? pendingShare(selectedKey) : [];
  if (pend.length) {
    bar.innerHTML = '<button id="send-now">' + ICON_SEND + 'Отправить близкому: ' + pend.length +
      (pend.length === 1 ? " приём" : pend.length < 5 ? " приёма" : " приёмов") + '</button>';
    bar.style.display = "block";
    document.getElementById("send-now").onclick = async function () {
      var items = pendingShare(selectedKey);
      if (!items.length) return;
      await shareText(takenMessage(prof, items, selectedKey));
      var taken = loadTakenFor(selectedKey);
      items.forEach(function (x) { if (taken[x.key]) taken[x.key].sent = true; });
      saveTakenFor(selectedKey, taken);
      render();
    };

    bar.style.display = "none";

    b.classList.toggle("active", b.dataset.nav === screen ||
      (b.dataset.nav === "people" && (screen === "help" || screen === "person")));

function readForm() {
  var g = function (id) { return document.getElementById(id); };

  document.querySelectorAll(".f-n").forEach(function (inp) { form.times[+inp.dataset.i].n = num(inp.value); });
  if (g("f-on")) form.on = Math.max(1, Math.floor(+g("f-on").value) || 1);
  if (g("f-off")) form.off = Math.max(0, Math.floor(+g("f-off").value) || 0);
  if (g("f-start")) form.start = g("f-start").value || dateKey();
  if (g("f-applyfrom")) form.applyFrom = g("f-applyfrom").value || form.applyFrom;
  if (g("f-pack")) form.pack = Math.max(1, +g("f-pack").value || 30);
  if (g("f-coursen")) form.courseN = Math.max(1, +g("f-coursen").value || 14);
}

function bindEvents() {
  // Выбор дня в недельной ленте
  el.querySelectorAll("[data-date]").forEach(function (cell) {
    cell.onclick = function () { selectedKey = cell.dataset.date; render(); };
  });
  var back = document.getElementById("back-today");
  if (back) back.onclick = function () { selectedKey = dateKey(); render(); };

  // Отметка приёма / отмена (сегодня и прошлые дни)
  el.querySelectorAll("[data-take]").forEach(function (btn) {
    btn.onclick = function () {
      var key = btn.dataset.take;
      var medId = +key.split("@")[0];
      var taken = loadTakenFor(selectedKey);
      var med = meds.find(function (m) { return m.id === medId; });
      var tm = med ? med.times.find(function (x) { return med.id + "@" + x.t === key; }) : null;
      var n = tm ? tm.n : 1;
      var stockId = med ? holderOf(med).id : medId;

      if (taken[key]) {
        if (!confirm("Отменить отметку о приёме?")) return;
        delete taken[key];
        meds = meds.map(function (m) { return m.id === stockId ? Object.assign({}, m, { stock: round2(m.stock + n) }) : m; });
        justTaken = null;
      } else {
        var retro = selectedKey < dateKey();
        var atTime = hhmm(new Date());
        taken[key] = retro ? { at: atTime, retro: true } : { at: atTime };
        meds = meds.map(function (m) { return m.id === stockId ? Object.assign({}, m, { stock: Math.max(0, round2(m.stock - n)) }) : m; });
        justTaken = key;
        if (highlightKey === key) highlightKey = null;
        setTimeout(function () { justTaken = null; }, 700);
        if (navigator.vibrate) navigator.vibrate(30);
      }
      saveTakenFor(selectedKey, taken); saveMeds(meds); syncNotifications(); render();
    };
  });

  // Приём вне расписания: открыть форму / удалить отметку
  var addExtra = document.getElementById("add-extra");
  if (addExtra) addExtra.onclick = function () { extraForm = blankExtra(); screen = "extra"; render(); };
  el.querySelectorAll("[data-extra]").forEach(function (card) {
    card.onclick = function () {
      var key = card.dataset.extra;
      var taken = loadTakenFor(selectedKey);
      var r = taken[key];
      if (!r || !confirm("Удалить отметку «" + r.name + "»?")) return;
      if (r.lin != null && !r.via) {
        meds = meds.map(function (m) { return m.id === r.lin ? Object.assign({}, m, { stock: round2(m.stock + r.n) }) : m; });
        saveMeds(meds);
      }
      delete taken[key];
      saveTakenFor(selectedKey, taken); render();
    };
  });

  if (screen === "extra") {
    var gx = function (id) { return document.getElementById(id); };
    gx("x-name").oninput = function () {
      if (extraForm.lin && gx("x-name").value) {
        // начали вписывать своё — снимаем выбор из списка
        extraForm.lin = null; extraForm.name = gx("x-name").value;
        el.querySelectorAll("[data-xmed]").forEach(function (b) { b.classList.remove("on"); });
      }
      readExtra(); gx("x-save").disabled = !extraValid();
    };
    el.querySelectorAll("[data-xmed]").forEach(function (btn) {
      btn.onclick = function () {
        readExtra();
        var lin = +btn.dataset.xmed;
        if (extraForm.lin === lin) { extraForm.lin = null; extraForm.name = ""; }
        else {
          var fam = famOf(lin), act = activeVersions(lin), m = act[0] || fam[fam.length - 1];
          extraForm.lin = lin; extraForm.name = m.name;
          extraForm.n = m.times.length ? m.times[0].n : 1;
        }
        render();
      };
    });
    gx("x-save").onclick = function () {
      readExtra();
      if (!extraValid()) return;
      var f = extraForm;
      var taken = loadTakenFor(selectedKey);
      var rec = { extra: true, name: f.name.trim().slice(0, 60), n: f.n, at: f.at, note: f.note.trim() };
      if (selectedKey < dateKey()) rec.retro = true;
      if (f.lin != null) {
        var holder = meds.find(function (m) { return m.id === f.lin; });
        if (holder) {
          rec.lin = holder.id;
          meds = meds.map(function (m) { return m.id === holder.id ? Object.assign({}, m, { stock: Math.max(0, round2(m.stock - f.n)) }) : m; });
          saveMeds(meds);
        }
      }
      taken["x:" + Date.now()] = rec;
      saveTakenFor(selectedKey, taken);
      if (navigator.vibrate) navigator.vibrate(30);
      screen = "today"; render();
    };
    gx("x-cancel").onclick = function () { screen = "today"; render(); };
  }

  // Изменить / пополнить / удалить / отменить запланированное изменение
  el.querySelectorAll("[data-edit]").forEach(function (btn) {
    btn.onclick = function () {
      var m = meds.find(function (x) { return x.id === +btn.dataset.edit; });
      if (!m) return;
      form = formFromMed(m); screen = "add"; render();
    };
  });
  el.querySelectorAll("[data-refill]").forEach(function (btn) {
    btn.onclick = function () {
      var id = +btn.dataset.refill;
      meds = meds.map(function (m) { return m.id === id ? Object.assign({}, m, { stock: round2(m.stock + m.pack) }) : m; });
      saveMeds(meds); render();
    };
  });
  el.querySelectorAll("[data-del]").forEach(function (btn) {
    btn.onclick = function () {
      var lin = +btn.dataset.del;
      var m = famOf(lin)[0];
      if (!confirm("Удалить «" + (m ? m.name : "") + "»? История приёмов тоже пропадёт.")) return;
      meds = meds.filter(function (x) { return linOf(x) !== lin; });
      saveMeds(meds); syncNotifications(); render();
    };
  });
  el.querySelectorAll("[data-cancelnext]").forEach(function (btn) {
    btn.onclick = function () {
      var lin = +btn.dataset.cancelnext;
      var act = activeVersions(lin);
      if (act.length < 2) return;
      var keepId = act[0].id, dropIds = act.slice(1).map(function (x) { return x.id; });
      meds = meds.filter(function (x) { return dropIds.indexOf(x.id) === -1; })
                 .map(function (x) { return x.id === keepId ? Object.assign({}, x, { until: null }) : x; });
      saveMeds(meds); syncNotifications(); render();
    };
  });

  var fixBtn = document.getElementById("fix-exact");
  if (fixBtn) fixBtn.onclick = async function () {
    var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (LN && LN.changeExactNotificationSetting) { try { await LN.changeExactNotificationSetting(); } catch (e) {} }
  };
  var resyncBtn = document.getElementById("resync");
  if (resyncBtn) resyncBtn.onclick = function () { syncNotifications(); };

  // Переключение профиля в шапке
  el.querySelectorAll("[data-pid]").forEach(function (btn) {
    btn.onclick = function () {
      curPid = btn.dataset.pid; cfgSet("last_profile", curPid);
      meds = loadMeds(); selectedKey = dateKey(); render();
    };
  });

  // ── Экран «Люди» ──
  el.querySelectorAll("[data-openp]").forEach(function (btn) {
    btn.onclick = function () {
      curPid = btn.dataset.openp; cfgSet("last_profile", curPid);
      meds = loadMeds(); screen = "today"; selectedKey = dateKey(); render();
    };
  });
  el.querySelectorAll("[data-editp]").forEach(function (btn) {
    btn.onclick = function () { personEditId = btn.dataset.editp; screen = "person"; render(); };
  });
  el.querySelectorAll("[data-delp]").forEach(function (btn) {
    btn.onclick = function () {
      var p = profiles.find(function (x) { return x.id === btn.dataset.delp; });
      if (!p || !confirm("Удалить карточку «" + p.name + "» со всеми лекарствами и историей?")) return;
      localStorage.removeItem("meds:" + p.id);
      localStorage.removeItem("vitals:" + p.id);
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf("taken:" + p.id + ":") === 0) localStorage.removeItem(k);
      }
      profiles = profiles.filter(function (x) { return x.id !== p.id; });
      saveProfiles(profiles);
      if (curPid === p.id) { curPid = profiles[0].id; cfgSet("last_profile", curPid); meds = loadMeds(); }
      syncNotifications(); render();
    };
  });
  var addP = document.getElementById("add-person");
  if (addP) addP.onclick = function () {
    var name = (prompt("Имя человека (как он назовёт себя у себя в приложении)") || "").trim();

      return alert("Карточка с таким именем уже есть");

              remind: false, watch: true, share: false, graceMin: 60 };

      new Date().toLocaleDateString("ru-RU") +
      ". Сохрани это сообщение — по нему данные восстанавливаются.\n\n" + backupMake());
    cfgSet("backup_at", new Date().toLocaleDateString("ru-RU"));

  var hBack = document.getElementById("help-back");
  if (hBack) hBack.onclick = function () { screen = "people"; render(); };
  var bToggle = document.getElementById("backup-toggle");
  if (bToggle) bToggle.onclick = function () {

    var back = document.getElementById("person-back");
    if (back) back.onclick = function () { screen = "people"; render(); };
    el.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.onclick = function () {
        var f = btn.dataset.toggle;
        p.name = (document.getElementById("person-name").value || p.name).trim().slice(0, 32) || p.name;
        p[f] = !p[f];
        saveProfiles(profiles); render();
      };
    });
    var save = document.getElementById("person-save");
    if (save) save.onclick = function () {
      var nm = (document.getElementById("person-name").value || "").trim().slice(0, 32);
      if (nm) p.name = nm;
      var gr = document.getElementById("person-grace");
      if (gr) p.graceMin = Math.min(720, Math.max(5, +gr.value || 60));
      saveProfiles(profiles); syncNotifications(); screen = "people"; render();
    };
    var plan = document.getElementById("person-plan");
    if (plan) plan.onclick = function () {
      var list = medsOf(p.id);
      if (!list.length) return alert("В этой карточке пока нет лекарств");
      shareText("Моё расписание приёма лекарств.\nОткрой ссылку — карточка «" + p.name +
                "» создастся автоматически:\n\n" + planLink(p, list));
    };
  }

  // Форма добавления
  if (screen === "add") {
    var g = function (id) { return document.getElementById(id); };
    ["f-name", "f-note"].forEach(function (id) {
      g(id).oninput = function () { readForm(); g("f-save").disabled = !formValid(); };
    });
    document.querySelectorAll(".f-time,.f-n").forEach(function (inp) { inp.onchange = readForm; });
    g("f-pack").onchange = readForm;
    g("f-strength").onchange = readForm;
    document.querySelectorAll("[data-form]").forEach(function (btn) {
      btn.onclick = function () { readForm(); form.form = btn.dataset.form; render(); };
    });
    if (g("f-on")) g("f-on").onchange = function () { readForm(); render(); };
    if (g("f-off")) g("f-off").onchange = function () { readForm(); render(); };
    if (g("f-start")) g("f-start").onchange = function () { readForm(); if (form.mode === "interval") render(); };
    document.querySelectorAll("[data-cyc]").forEach(function (btn) {
      btn.onclick = function () {
        readForm();
        var p = btn.dataset.cyc.split(",");
        form.on = +p[0]; form.off = +p[1]; render();
      };
    });
    if (g("f-applyfrom")) g("f-applyfrom").onchange = readForm;
    if (g("f-now")) g("f-now").onclick = function () { readForm(); form.applyMode = "now"; render(); };
    if (g("f-from")) g("f-from").onclick = function () { readForm(); form.applyMode = "from"; render(); };
    document.querySelectorAll("[data-remind]").forEach(function (btn) {
      btn.onclick = function () {
        readForm();
        var v = +btn.dataset.remind, at = form.remindOffsets.indexOf(v);
        if (at === -1) form.remindOffsets.push(v); else form.remindOffsets.splice(at, 1);
        form.remindOffsets.sort(function (a, b) { return a - b; });
        render();
      };
    });
    if (g("f-coursen")) g("f-coursen").onchange = readForm;
    g("f-addtime").onclick = function () { readForm(); form.times.push({ t: "21:00", n: form.times[0].n }); render(); };
    document.querySelectorAll(".f-del").forEach(function (btn) {
      btn.onclick = function () { readForm(); form.times.splice(+btn.dataset.i, 1); render(); };
    });
    document.querySelectorAll("[data-day]").forEach(function (btn) {
      btn.onclick = function () {
        readForm();
        var i = +btn.dataset.day, at = form.days.indexOf(i);
        if (at === -1) form.days.push(i); else form.days.splice(at, 1);
        form.days.sort(function (a, b) { return a - b; });
        render();
      };
    });
    g("f-weekly").onclick = function () { readForm(); form.mode = "weekly"; render(); };
    g("f-interval").onclick = function () { readForm(); form.mode = "interval"; render(); };
    g("f-forever").onclick = function () { readForm(); form.forever = true; render(); };
    g("f-course").onclick = function () { readForm(); form.forever = false; render(); };
    g("f-save").onclick = function () {
      readForm();
      if (!formValid()) return;
      var fields = {
        name: form.name.trim(), form: form.form, strength: form.strength.trim(), doseNote: form.doseNote.trim(),
        times: form.times.map(function (x) { return { t: x.t, n: x.n }; }),
        mode: form.mode, days: form.days.slice(),
        every: form.mode === "interval" ? form.on + form.off : form.every,
        onDays: form.mode === "interval" ? form.on : 1,
        remindOffsets: form.remindOffsets.slice(),
        courseDays: form.forever ? null : form.courseN,
      };

      if (!form.editId) {
        // Новое лекарство
        var newId = Date.now();
        meds.push(Object.assign({ id: newId, lineage: newId, until: null,
          start: form.start || dateKey(), stock: form.pack, pack: form.pack,
          color: PILL_COLORS[Math.floor(Math.random() * PILL_COLORS.length)] }, fields));
      } else {
        var old = meds.find(function (x) { return x.id === form.editId; });
        var holder = holderOf(old);
        // Упаковка/запас общие для всех версий — обновляем сразу
        if (form.pack !== holder.pack) {
          meds = meds.map(function (x) { return x.id === holder.id ? Object.assign({}, x, { pack: form.pack }) : x; });
        }
        var editingFuture = old.start > dateKey();

        if (form.applyMode === "from" && !editingFuture) {
          // Новая версия с выбранной даты, старая закрывается этим днём
          var from = form.applyFrom;
          var lin = linOf(old);
          // убираем ранее запланированные версии этой линейки, начинающиеся не раньше from
          meds = meds.filter(function (x) { return !(linOf(x) === lin && x.id !== old.id && x.start >= from); });
          meds = meds.map(function (x) { return x.id === old.id ? Object.assign({}, x, { until: from }) : x; });
          meds.push(Object.assign({ id: Date.now(), lineage: lin, until: null, start: from,
            stock: 0, pack: form.pack, color: old.color }, fields));
        } else {
          // Правка на месте
          meds = meds.map(function (x) {
            return x.id === old.id
              ? Object.assign({}, x, fields, editingFuture ? { start: form.start || x.start } : {})
              : x;
          });
        }
      }
      saveMeds(meds); syncNotifications();
      screen = form.editId ? "meds" : "today";
      selectedKey = dateKey(); render();
    };
    g("f-cancel").onclick = function () { screen = form.editId ? "meds" : "today"; render(); };
  }
}

// ─── Обмен без сервера: системное «Поделиться» и ссылки ───
// Ничего никуда не отправляется само. Сообщение отправляет сам человек,
// своим мессенджером, тому, кому считает нужным.

function b64e(s) {
  var bytes = new TextEncoder().encode(s), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function shareText(text) {
  var Sh = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
  try {
    if (Sh) { await Sh.share({ text: text, dialogTitle: "Отправить близкому" }); return true; }
    if (navigator.share) { await navigator.share({ text: text }); return true; }
  } catch (e) { return false; }        // пользователь закрыл окно выбора — это не ошибка
  try { await navigator.clipboard.writeText(text); alert("Скопировано — вставь в мессенджер"); return true; }
  catch (e) { alert(text); return true; }
}

// Сообщение об отметке приёмов — одно на любое их количество
function takenMessage(prof, items, dateK) {
  var payload = items.map(function (x) {
    // t пустой у внеплановых — старые версии не спутают их с плановым приёмом
    return x.extra ? { k: x.key, t: "", at: x.at, x: 1, nm: x.med.name, n: x.n }
                   : { k: x.key, t: x.time, at: x.at };
  });
  var link = "medapp://taken?p=" + encodeURIComponent(prof.name) +
             "&d=" + dateK + "&b=" + b64e(JSON.stringify(payload));
  var who = prof.self ? "Я" : prof.name;
  var when = parseKey(dateK).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  var lines = items.map(function (x) {
    if (x.extra) return "✓ вне расписания — " + x.med.name + ", " + fmtN(x.n) + " " + unitOf(x.med) + " (принято в " + x.at + ")";
    return "✓ " + x.time + " — " + x.med.name + ", " + fmtN(x.n) + " " + unitOf(x.med) + " (принято в " + x.at + ")";
  });
  return who + ", " + when + (items.length > 1 ? " — приняты:" : " — принято:") + "\n" +
         lines.join("\n") + "\n\nОтметить у себя: " + link;
}

// Приёмы, отмеченные, но ещё не отправленные близкому
function pendingShare(dateK) {
  var taken = loadTakenFor(dateK), out = [];
  intakesFor(parseKey(dateK)).forEach(function (it) {
    var rec = taken[it.key];
    if (rec && !rec.sent && !rec.via) out.push({ key: it.key, time: it.time, n: it.n, med: it.med, at: rec.at });
  });
  extrasOf(taken).forEach(function (x) {
    var r = x.rec;
    if (!r.sent && !r.via) out.push({ key: x.key, time: r.at, n: r.n, med: { name: r.name }, at: r.at, extra: true });
  });
  return out;
}

// Ссылка с расписанием — чтобы у близкого карточка совпала один в один
function planLink(prof, medsList) {
  var payload = { n: prof.name, m: medsList.map(function (m) {
    return { id: m.id, lineage: m.lineage, name: m.name, form: m.form, strength: m.strength, doseNote: m.doseNote,
             times: m.times, mode: m.mode, days: m.days, every: m.every, onDays: m.onDays,
             start: m.start, until: m.until, courseDays: m.courseDays,
             remindOffsets: m.remindOffsets, pack: m.pack, stock: m.stock, color: m.color };
  }) };
  return "medapp://plan?d=" + b64e(JSON.stringify(payload));
}

// ─── Приём входящих ссылок ───
function applyTakenLink(params) {
  var pname = params.get("p") || "", dateK = params.get("d") || dateKey();
  var prof = profiles.find(function (p) { return p.name.toLowerCase() === pname.toLowerCase(); });
  if (!prof) {
    alert("Нет карточки «" + pname + "». Создай её на вкладке «Люди» — и ссылки начнут отмечаться сами.");
    screen = "people"; render(); return;
  }

  // Новый формат — пакет приёмов; старый — один приём в параметрах
  var batch = [];
  if (params.get("b")) {
    try { batch = JSON.parse(b64d(params.get("b"))); } catch (e) { batch = []; }
  }
  if (!batch.length) batch = [{ k: params.get("k") || "", t: params.get("t") || "", at: params.get("at") || "" }];

  var taken = takenOf(prof.id, dateK);
  var list = medsOf(prof.id);
  var applied = 0;

  batch.forEach(function (b) {
    if (b.x) {
      if (!b.k || b.k.indexOf("x:") !== 0) return;
      taken[b.k] = { extra: true, name: String(b.nm || "Лекарство").slice(0, 60), n: num(b.n), at: b.at || hhmm(new Date()), via: "link" };
      applied++;
      return;
    }
    var hit = b.k;
    var exists = list.some(function (m) {
      return m.times.some(function (x) { return m.id + "@" + x.t === b.k; });
    });
    if (!exists) {   // ключи не совпали — ищем по плановому времени
      var byTime = null;
      list.forEach(function (m) {
        m.times.forEach(function (x) {
          if (x.t === b.t && !byTime && !taken[m.id + "@" + x.t]) byTime = m.id + "@" + x.t;
        });
      });
      hit = byTime || b.k;
    }
    if (!hit) return;
    taken[hit] = { at: b.at || hhmm(new Date()), via: "link" };
    applied++;
  });

  localStorage.setItem("taken:" + prof.id + ":" + dateK, JSON.stringify(taken));
  curPid = prof.id; cfgSet("last_profile", curPid);
  meds = loadMeds(); screen = "today"; selectedKey = dateK;
  syncNotifications(); render();
  if (navigator.vibrate) navigator.vibrate(30);
  if (applied > 1) setTimeout(function () { alert("Отмечено приёмов: " + applied); }, 100);
}

function applyPlanLink(params) {
  var raw = params.get("d");
  if (!raw) return;
  var data;
  try { data = JSON.parse(b64d(raw)); } catch (e) { return alert("Не удалось прочитать ссылку с расписанием"); }
  var name = (data.n || "Близкий").slice(0, 32);
  var prof = profiles.find(function (p) { return p.name.toLowerCase() === name.toLowerCase(); });
  if (prof) {
    if (!confirm("Обновить расписание в карточке «" + prof.name + "»?")) return;
  } else {
    if (!confirm("Создать карточку «" + name + "» с её расписанием?")) return;
    prof = { id: "p" + Date.now(), name: name, self: false,
             remind: false, watch: true, share: false, graceMin: 60 };
    profiles.push(prof); saveProfiles(profiles);
  }
  localStorage.setItem("meds:" + prof.id, JSON.stringify(data.m || []));
  curPid = prof.id; cfgSet("last_profile", curPid);
  meds = loadMeds(); screen = "today"; selectedKey = dateKey();
  syncNotifications(); render();
}

function handleUrl(url) {
  if (!url) return;
  var q = url.indexOf("?");
  var params = new URLSearchParams(q >= 0 ? url.slice(q + 1) : "");
  if (url.indexOf("taken") >= 0) applyTakenLink(params);
  else if (url.indexOf("plan") >= 0) applyPlanLink(params);
}

(function initDeepLinks() {
  var App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) {
    App.addListener("appUrlOpen", function (ev) { handleUrl(ev && ev.url); });
    if (App.getLaunchUrl) App.getLaunchUrl().then(function (r) { if (r && r.url) handleUrl(r.url); }).catch(function () {});
  }
  if (location.search.indexOf("taken") >= 0 || location.search.indexOf("plan") >= 0) handleUrl(location.href);
})();

      : '') +

    '<button class="btn-main" id="person-save">Сохранить</button>' +
    '<button class="btn-ghost" id="person-plan">Поделиться расписанием этой карточки</button>';
}

// ─── Резервная копия ───
// Собирает профили, лекарства и историю в один текст. Хранить можно где угодно —
// отправить себе в мессенджер, сохранить в заметки. Восстановление — вставкой текста.
function backupMake() {
  var dump = { v: 2, at: new Date().toISOString(), profiles: profiles, data: {} };
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && (k.indexOf("meds:") === 0 || k.indexOf("taken:") === 0 || k.indexOf("vitals:") === 0)) dump.data[k] = localStorage.getItem(k);
  }
  return "МОИ-ТАБЛЕТКИ-КОПИЯ:" + b64e(JSON.stringify(dump));
}

// Копия файлом: пишем во временную папку и отдаём системному «Поделиться» —
// дальше человек сам выбирает: «Загрузки», диск, мессенджер
async function backupToFile() {
  var text = backupMake();
  var name = "prinyato-kopiya-" + dateKey() + ".txt";
  var P = window.Capacitor && window.Capacitor.Plugins;
  try {
    if (P && P.Filesystem && P.Share) {
      var r = await P.Filesystem.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
      await P.Share.share({ title: "Резервная копия «Принято»", files: [r.uri], dialogTitle: "Сохранить копию" });
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
    return true;
  } catch (e) {
    if (String(e && e.message || e).indexOf("cancel") !== -1) return false; // закрыли окно «Поделиться»
    alert("Не получилось сохранить файл. Попробуй «Отправить копию текстом»");
    return false;
  }
}

function backupRestore(text) {
  var marker = "МОИ-ТАБЛЕТКИ-КОПИЯ:";
  var at = (text || "").indexOf(marker);
  if (at < 0) { alert("Это не похоже на резервную копию"); return false; }
  var dump;
  try { dump = JSON.parse(b64d(text.slice(at + marker.length).trim())); }
  catch (e) { alert("Копия повреждена — текст скопирован не целиком?"); return false; }
  if (!dump.profiles || !dump.data) { alert("В копии нет данных"); return false; }
  if (!confirm("Восстановить " + dump.profiles.length + " карточек? Текущие данные будут заменены.")) return false;

  for (var i = localStorage.length - 1; i >= 0; i--) {
    var k = localStorage.key(i);
    if (k && (k.indexOf("meds:") === 0 || k.indexOf("taken:") === 0 || k.indexOf("vitals:") === 0)) localStorage.removeItem(k);
  }
  Object.keys(dump.data).forEach(function (k) { localStorage.setItem(k, dump.data[k]); });
  profiles = dump.profiles; saveProfiles(profiles);
  curPid = profiles[0].id; cfgSet("last_profile", curPid);
  meds = loadMeds(); screen = "today"; selectedKey = dateKey();
  syncNotifications(); render();
  alert("Данные восстановлены");
  return true;
}

// ─── Локальные уведомления (Capacitor) ───
// Планируем конкретные напоминания на 14 дней вперёд (это покрывает и интервальные
// схемы вроде «через день»). Список пересоздаётся при каждом открытии приложения.
async function syncNotifications() {
  var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if (!LN) return;
  try {
    var perm = await LN.requestPermissions();
    if (perm.display !== "granted") return;
    var pending = await LN.getPending();
    if (pending.notifications && pending.notifications.length) {
      await LN.cancel({ notifications: pending.notifications.map(function (n) { return { id: n.id }; }) });
    }
    var notifs = [], id = 1, now = new Date();
    for (var off = 0; off < 14; off++) {
      var d = new Date(); d.setDate(d.getDate() + off);
      var dk = dateKey(d);
      profiles.forEach(function (prof) {
        if (!prof.remind && !prof.watch) return;
        var dayTaken = takenOf(prof.id, dk);
        var who = prof.self ? "" : prof.name + ": ";
        medsOf(prof.id).forEach(function (m) {
          if (!occursOn(m, d)) return;
          m.times.forEach(function (tm) {
            if (dayTaken[m.id + "@" + tm.t]) return;   // уже отмечено — не напоминаем
            var parts = tm.t.split(":");
            var base = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +parts[0], +parts[1], 0);

            if (prof.remind) {
              (m.remindOffsets || []).forEach(function (mins) {
                var when = new Date(base.getTime() - mins * 60000);
                if (when <= now) return;
                notifs.push({
                  id: id++,
                  title: mins > 0 ? "Скоро приём лекарства ⏰" : "Пора принять лекарство 💊",
                  body: who + m.name + " — " + fmtN(tm.n) + " " + unitOf(m) +
                    (mins > 0 ? ", приём в " + tm.t : "") +
                    (m.doseNote ? " (" + m.doseNote + ")" : ""),
                  extra: { pid: prof.id, date: dk, key: m.id + "@" + tm.t },
                  schedule: { at: when, allowWhileIdle: true },
                });
              });
            }

            if (prof.watch) {
              // Сторожевое: если к сроку подтверждения нет — предупредить
              var alarm = new Date(base.getTime() + (prof.graceMin || 60) * 60000);
              if (alarm > now) notifs.push({
                id: id++,
                title: "Приём не подтверждён ⚠️",
                body: prof.name + " не отметил(а) приём в " + tm.t + " — " + m.name,
                extra: { pid: prof.id, date: dk, key: m.id + "@" + tm.t },
                schedule: { at: alarm, allowWhileIdle: true },
              });
            }
          });
        });
      });
    }
    notifs = notifs.slice(0, 450); // запас до системного лимита будильников Android
    if (notifs.length) await LN.schedule({ notifications: notifs });

    // Диагностика для экрана «Лекарства»
    notifInfo.supported = true;
    notifInfo.count = notifs.length;
    if (notifs.length) {
      var soonest = notifs.reduce(function (a, b) { return a.schedule.at < b.schedule.at ? a : b; });
      var w = soonest.schedule.at;
      var dayWord = dateKey(w) === dateKey() ? "сегодня"
        : dateKey(w) === dateKey(new Date(Date.now() + 86400000)) ? "завтра"
        : w.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
      notifInfo.next = dayWord + " в " + hhmm(w);
    } else notifInfo.next = null;
    if (LN.checkExactNotificationSetting) {
      try { notifInfo.exact = (await LN.checkExactNotificationSetting()).exact_alarm; }
      catch (e) { notifInfo.exact = "granted"; }
    } else notifInfo.exact = "granted";
    if (screen === "meds") render();
  } catch (e) { console.warn("notifications:", e); }
}

// Нажатие на уведомление → открываем нужный день и подсвечиваем приём
(function initNotifTap() {
  var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if (!LN) return;
  LN.addListener("localNotificationActionPerformed", function (ev) {
    var x = ev && ev.notification && ev.notification.extra;
    if (!x || !x.key) return;
    if (x.pid && profiles.some(function (p) { return p.id === x.pid; })) {
      curPid = x.pid; cfgSet("last_profile", curPid); meds = loadMeds();
    }
    screen = "today";
    selectedKey = x.date || dateKey();
    highlightKey = x.key;
    render();
    var hl = el.querySelector('[data-key="' + highlightKey + '"]');
    if (hl) hl.scrollIntoView({ block: "center", behavior: "smooth" });
  });
})();

// При возврате в приложение — обновляем экран и перепланируем напоминания
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    if (screen === "today") { selectedKey = dateKey(); render(); }
    syncNotifications();

  }
});

render();
syncNotifications();
</script>
