<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F8F4">
<title>Мои таблетки</title>
<style>
  :root{
    --bg:#F2F8F4; --card:#FFFFFF; --ink:#1F2E27; --mute:#6B7F74;
    --green:#3E7C59; --green-soft:#E3F0E8; --amber:#E8A13C;
    --coral:#D9603B; --coral-soft:#FBEAE3; --line:#DCE8E0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:'Nunito', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column;
  }
  button,input{ font-family:inherit; }
  #screen{ flex:1; padding:24px 18px 120px; animation:rise .35s ease both; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  @keyframes rise{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
  @media (prefers-reduced-motion: reduce){ #screen{ animation:none } }

  h1{ margin:2px 0 4px; font-size:26px; font-weight:900; }
  .date{ margin:0; color:var(--mute); font-weight:700; font-size:14px; }
  .sub{ margin:0 0 18px; color:var(--mute); font-size:15px; font-weight:600; }

  .week{ display:flex; gap:6px; margin-bottom:22px; }
  .wday{
    flex:1; border-radius:14px; padding:10px 0 8px; text-align:center; cursor:pointer;
    background:var(--card); border:2px solid var(--line); transition:all .2s;
  }
  .wday.today{
    background:var(--green); border-color:var(--green);
    box-shadow:0 6px 14px rgba(62,124,89,.28);
  }
  .wday.sel{ transform:translateY(-4px); border-color:var(--green); }
  .wday .lbl{ font-size:11px; font-weight:800; color:var(--mute); }
  .wday .num{ font-size:12px; font-weight:900; color:var(--ink); }
  .wday.today .lbl, .wday.today .num{ color:#fff; }
  .dots{ display:flex; gap:2px; justify-content:center; margin-top:4px; min-height:5px; }
  .dots span{ width:4px; height:4px; border-radius:99px; background:#B8CDC0; }
  .wday.today .dots span{ background:#CFE8DA; }

  .card{
    background:var(--card); border-radius:20px; padding:14px; margin-bottom:12px;
    display:flex; align-items:center; gap:12px; border:2px solid var(--line); transition:all .25s;
  }
  .card.taken{ border-color:var(--green-soft); opacity:.75; }
  .card.soon{ border-color:var(--amber); }
  .card.missed{ border-color:var(--coral-soft); }
  .card[data-take]{ cursor:pointer; }
  .card.flash{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(232,161,60,.25); }
  .pill-btn{
    width:54px; height:54px; border-radius:18px; border:none; cursor:pointer;
    background:var(--green-soft); flex-shrink:0;
    box-shadow:inset 0 -3px 0 rgba(62,124,89,.15);
  }
  .pill-btn.done{ background:var(--green); box-shadow:inset 0 2px 6px rgba(0,0,0,.15); }
  .pill-btn.locked{ cursor:default; opacity:.55; }
  .pill-btn.popping{ animation:pop .5s ease; }
  .pill-btn .check{ color:#fff; font-size:24px; font-weight:900; }
  .pill-shape{
    display:inline-block; width:26px; height:14px; border-radius:99px;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .card .info{ flex:1; min-width:0; }
  .med-name{ font-weight:800; font-size:17px; }
  .card.taken .med-name{ text-decoration:line-through; }
  .med-dose{ font-size:14px; color:var(--mute); font-weight:600; }
  .low-badge{
    margin-top:4px; display:inline-block; background:var(--coral-soft); color:var(--coral);
    font-size:12px; font-weight:800; border-radius:99px; padding:2px 10px;
  }
  .card .right{ text-align:right; flex-shrink:0; }
  .time{ font-weight:900; font-size:16px; }
  .time.soon{ color:var(--amber); }
  .status{ font-size:12px; color:var(--mute); font-weight:700; }
  .status.taken-at{ color:var(--green); }
  .status.miss{ color:var(--coral); }

  .empty{
    background:var(--card); border-radius:20px; padding:28px; text-align:center;
    border:2px dashed var(--line);
  }
  .empty .emoji{ font-size:34px; }
  .empty p{ margin:8px 0 4px; font-weight:800; }
  .empty .hint{ color:var(--mute); font-size:14px; font-weight:600; margin:0; }

  .stock-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-bottom:5px; }
  .stock-bar{ height:8px; border-radius:99px; background:var(--green-soft); overflow:hidden; }
  .stock-bar div{ height:100%; background:var(--green); border-radius:99px; transition:width .3s; }
  .stock-bar.low div{ background:var(--coral); }
  .med-actions{ display:flex; gap:8px; margin-top:12px; }
  .btn-small{
    flex:1; padding:10px 0; border-radius:12px; font-weight:800; font-size:13px; cursor:pointer;
    border:2px solid var(--line); background:var(--card); color:var(--mute);
  }
  .btn-small.primary{ border-color:var(--green); color:var(--green); }
  .btn-small.danger{ border-color:var(--coral-soft); color:var(--coral); }

  label{ font-size:13.5px; font-weight:800; color:var(--mute); margin:16px 0 6px; display:block; }
  .hint-line{ font-size:12.5px; color:var(--mute); font-weight:600; margin:6px 0 0; }
  .inp{
    width:100%; padding:13px 14px; border-radius:14px; border:2px solid var(--line);
    font-size:16px; font-weight:700; color:var(--ink); background:var(--card); outline:none;
  }
  .inp:focus{ border-color:var(--green); }
  .time-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .time-row .inp.t{ flex:1.6; }
  .time-row .inp.n{ flex:1; }
  .time-row .del{
    width:40px; height:40px; border-radius:12px; border:2px solid var(--line);
    background:var(--card); color:var(--coral); font-weight:900; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .link-btn{ border:none; background:none; color:var(--green); font-weight:800; font-size:14px; cursor:pointer; padding:0; }
  .day-chips{ display:flex; gap:6px; }
  .day-chip{
    flex:1; padding:10px 0; border-radius:12px; font-weight:800; font-size:12px; cursor:pointer;
    border:2px solid var(--line); background:var(--card); color:var(--mute);
  }
  .day-chip.on{ border-color:var(--green); background:var(--green); color:#fff; }
  .chips2{ display:flex; gap:8px; }
  .chip{
    flex:1; padding:12px 0; border-radius:14px; font-weight:800; font-size:14px; cursor:pointer;
    border:2px solid var(--line); background:var(--card); color:var(--mute);
  }
  .chip.on{ border-color:var(--green); background:var(--green); color:#fff; }
  .chips-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .chips-wrap .chip{ flex:none; padding:10px 14px; font-size:13px; }
  .btn-main{
    width:100%; margin-top:24px; padding:16px 0; border-radius:99px; border:none;
    background:var(--green); color:#fff; font-weight:900; font-size:17px; cursor:pointer;
  }
  .btn-main:disabled{ background:var(--line); color:var(--mute); cursor:not-allowed; }
  .btn-ghost{
    width:100%; margin-top:8px; padding:10px 0; border:none; background:none;
    color:var(--mute); font-weight:700; font-size:14px; cursor:pointer;
  }

  #fab{
    position:fixed; right:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:15;
    width:58px; height:58px; border-radius:20px; border:none; background:var(--green); color:#fff;
    font-size:30px; font-weight:800; cursor:pointer; line-height:1;
    box-shadow:0 8px 18px rgba(62,124,89,.4);
  }
  #nav{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:2px solid var(--line); display:flex; z-index:10;
    padding:10px 0 calc(14px + env(safe-area-inset-bottom));
  }
  #nav button{
    flex:1; border:none; background:none; cursor:pointer;
    color:var(--mute); font-weight:800; font-size:12.5px;
  }
  #nav button.active{ color:var(--green); }
  #nav .icon{ font-size:20px; }
</style>
</head>
<body>
  <div id="screen"></div>
  <button id="fab" aria-label="Добавить лекарство">+</button>
  <div id="nav">
    <button data-nav="today"><div class="icon">🕘</div>Сегодня</button>
    <button data-nav="meds"><div class="icon">💊</div>Лекарства</button>
    <button data-nav="people"><div class="icon">👥</div>Люди</button>
  </div>

<script>
"use strict";
// ─── Константы ───
var PILL_COLORS = ["#7FB69B", "#E8A13C", "#8FA8D9", "#D98FB0", "#B69B7F"];
var DAY_NAMES = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
var REMIND_OPTS = [
  { v: 0, l: "В момент приёма" }, { v: 10, l: "За 10 мин" }, { v: 30, l: "За 30 мин" },
  { v: 60, l: "За 1 час" }, { v: 120, l: "За 2 часа" }
];

// ─── Даты ───
function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function stripTime(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function diffDays(a, b) { return Math.round((stripTime(b) - stripTime(a)) / 86400000); }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dayIdx(d) { return (d.getDay() + 6) % 7; } // ПН = 0
function round2(x) { return Math.round(x * 100) / 100; }
function num(v) { var x = parseFloat(String(v).replace(",", ".")); return isFinite(x) && x > 0 ? round2(x) : 1; }
function fmtN(n) { return String(n).replace(".", ","); }

// ─── Настройки ───
function cfgGet(k, d) { try { var v = localStorage.getItem("cfg:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function cfgSet(k, v) { localStorage.setItem("cfg:" + k, JSON.stringify(v)); }

// ─── Профили (карточки людей) ───
// Всё лежит только на телефоне. Никакого сервера, никаких аккаунтов.
// self  — мой профиль: после отметки предлагаем поделиться с близким
// watch — профиль другого человека: сторожевое напоминание, если приём не подтверждён
function loadProfiles() {
  try { var p = JSON.parse(localStorage.getItem("profiles")); if (p && p.length) return p; } catch (e) {}
  return [{ id: "self", name: "Я", self: true, remind: true, watch: false, share: true, graceMin: 60 }];
}
function saveProfiles(p) { localStorage.setItem("profiles", JSON.stringify(p)); }

var profiles = loadProfiles();
var curPid = cfgGet("last_profile", "");
if (!profiles.some(function (p) { return p.id === curPid; })) curPid = profiles[0].id;

function curProfile() {
  return profiles.find(function (p) { return p.id === curPid; }) || profiles[0];
}

// ─── Хранилище (в разрезе профиля) ───
function medsOf(pid) { try { return JSON.parse(localStorage.getItem("meds:" + pid)) || []; } catch (e) { return []; } }
function takenOf(pid, key) { try { return JSON.parse(localStorage.getItem("taken:" + pid + ":" + key)) || {}; } catch (e) { return {}; } }

function loadMeds() { return medsOf(curPid); }
function saveMeds(m) { localStorage.setItem("meds:" + curPid, JSON.stringify(m)); }
function loadTakenFor(key) { return takenOf(curPid, key); }
function saveTakenFor(key, t) { localStorage.setItem("taken:" + curPid + ":" + key, JSON.stringify(t)); }

// Миграция с версий без профилей: всё, что было, становится профилем «Я»
(function migrateToProfiles() {
  if (localStorage.getItem("meds") !== null) {
    localStorage.setItem("meds:self", localStorage.getItem("meds"));
    localStorage.removeItem("meds");
  }
  var moves = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    // старый формат: taken:2026-07-23 (ровно одна часть после префикса)
    if (k && k.indexOf("taken:") === 0 && k.split(":").length === 2) moves.push(k);
  }
  moves.forEach(function (k) {
    localStorage.setItem("taken:self:" + k.slice(6), localStorage.getItem(k));
    localStorage.removeItem(k);
  });
  if (localStorage.getItem("profiles") === null) saveProfiles(profiles);
})();

// Чистим отметки старше 90 дней
(function cleanup() {
  var limit = new Date(); limit.setDate(limit.getDate() - 90);
  for (var i = localStorage.length - 1; i >= 0; i--) {
    var k = localStorage.key(i);
    var parts = k ? k.split(":") : [];
    if (parts[0] === "taken" && parts.length === 3 && parts[2] < dateKey(limit)) localStorage.removeItem(k);
  }
})();

// ─── Состояние ───
var meds = loadMeds();
var screen = "today";
var selectedKey = dateKey();   // выбранный день в недельной ленте
var justTaken = null;
var highlightKey = null;       // карточка, в которую «провалились» из уведомления
var notifInfo = { supported: false, count: 0, next: null, exact: "unknown" };
var personEditId = null;

// Миграция данных из версии 1.0 (не теряем уже введённые лекарства)
(function migrate() {
  var changed = false;
  meds = meds.map(function (m) {
    var nm = Object.assign({}, m);
    if (nm.times.length && typeof nm.times[0] === "string") {
      var n = 1, note = nm.dose || "";
      var match = /^(\d+)\s*(.*)$/.exec(note);
      if (match) { n = Math.max(1, +match[1]); note = match[2]; }
      nm.times = nm.times.map(function (t) { return { t: t, n: n }; });
      nm.doseNote = note; delete nm.dose; changed = true;
    }
    if (!nm.mode) { nm.mode = "weekly"; changed = true; }
    if (!nm.start) { nm.start = dateKey(); changed = true; }
    if (nm.every == null) { nm.every = 2; changed = true; }
    if (nm.remindOffsets == null) { nm.remindOffsets = [nm.remindBefore || 0]; delete nm.remindBefore; changed = true; }
    if (nm.doseNote == null) nm.doseNote = "";
    if (nm.lineage == null) { nm.lineage = nm.id; changed = true; }
    if (nm.until === undefined) { nm.until = null; changed = true; }
    return nm;
  });
  if (changed) saveMeds(meds);
})();

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// ─── Расписание: принимается ли лекарство в конкретную дату ───
function occursOn(m, date) {
  if (m.until && dateKey(date) >= m.until) return false; // версия заменена новой
  var diff = diffDays(parseKey(m.start), date);
  if (diff < 0) return false;
  if (m.courseDays && diff >= m.courseDays) return false;
  if (m.mode === "interval") return diff % Math.max(1, m.every) === 0;
  return m.days.indexOf(dayIdx(date)) !== -1;
}

// ─── Версии одного лекарства ───
// Правки «с будущей даты» создают новую версию, старая закрывается полем until.
// Запас общий для всех версий и хранится в корневой записи (id === lineage).
function linOf(m) { return m.lineage || m.id; }
function famOf(lin) {
  return meds.filter(function (x) { return linOf(x) === lin; })
             .sort(function (a, b) { return a.start.localeCompare(b.start); });
}
function holderOf(m) {
  var root = meds.find(function (x) { return x.id === linOf(m); });
  return root || m;
}
function activeVersions(lin) {
  var today = dateKey();
  return famOf(lin).filter(function (x) { return !x.until || x.until > today; });
}

function intakesFor(date) {
  var list = [];
  meds.forEach(function (m) {
    if (occursOn(m, date)) m.times.forEach(function (tm) {
      list.push({ med: m, time: tm.t, n: tm.n, key: m.id + "@" + tm.t });
    });
  });
  return list.sort(function (a, b) { return a.time.localeCompare(b.time); });
}

function schedText(m) {
  if (m.mode === "interval") {
    return m.every === 1 ? "каждый день" : m.every === 2 ? "через день" : "каждые " + m.every + " дн.";
  }
  return m.days.length === 7 ? "каждый день" : m.days.map(function (d) { return DAY_NAMES[d]; }).join(" ");
}

function remindText(m) {
  var o = m.remindOffsets || [];
  if (!o.length) return "без напоминаний";
  return "напомнит: " + o.map(function (v) {
    if (v === 0) return "в момент";
    if (v % 60 === 0) return "за " + (v / 60) + " ч";
    return "за " + v + " мин";
  }).join(", ");
}

// ─── Экран «Сегодня» (с просмотром любого дня недели) ───
function renderToday() {
  var todayK = dateKey();
  var selDate = parseKey(selectedKey);
  var isToday = selectedKey === todayK;
  var isFuture = selectedKey > todayK;
  var isPast = selectedKey < todayK;
  var nowStr = hhmm(new Date());
  var taken = loadTakenFor(selectedKey);
  var intakes = intakesFor(selDate);
  var done = intakes.filter(function (i) { return taken[i.key]; }).length;

  var dateStr = selDate.toLocaleDateString("ru-RU", isToday
    ? { day: "numeric", month: "long" }
    : { weekday: "long", day: "numeric", month: "long" });

  var title = isToday
    ? (done === intakes.length && intakes.length > 0 ? "Всё принято 🎉" : "Пора заботиться о себе")
    : isFuture ? "План на этот день"
    : (intakes.length === 0 ? "Приёмов не было" : done === intakes.length ? "Всё было принято ✅" : "Были пропуски");

  var sub = isFuture ? "Запланировано приёмов: " + intakes.length
    : "Принято: " + done + " из " + intakes.length;

  // Недельная лента: ПН–ВС текущей недели, все дни кликабельны
  var monday = stripTime(new Date());
  monday.setDate(monday.getDate() - dayIdx(monday));
  var week = "";
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday); d.setDate(monday.getDate() + i);
    var k = dateKey(d);
    var cnt = Math.min(intakesFor(d).length, 4), dots = "";
    for (var j = 0; j < cnt; j++) dots += "<span></span>";
    week += '<div class="wday' + (k === todayK ? " today" : "") + (k === selectedKey ? " sel" : "") + '" data-date="' + k + '" role="button">' +
      '<div class="lbl">' + DAY_NAMES[i] + '</div><div class="num">' + d.getDate() + '</div><div class="dots">' + dots + '</div></div>';
  }

  var switcher = profiles.length > 1
    ? '<div class="chips-wrap" style="margin-bottom:12px">' + profiles.map(function (p) {
        return '<button class="chip' + (p.id === curPid ? " on" : "") + '" data-pid="' + esc(p.id) + '">' +
          (p.self ? "🙂 " : "👤 ") + esc(p.name) + '</button>';
      }).join("") + '</div>'
    : '';

  var html = switcher + '<p class="date">' + esc(dateStr) + '</p>' +
    '<h1>' + title + '</h1>' +
    '<p class="sub" style="margin-bottom:' + (isToday ? '18' : '6') + 'px">' + sub + '</p>' +
    (!isToday ? '<p style="margin:0 0 14px"><button class="link-btn" id="back-today">← вернуться к сегодня</button></p>' : '') +
    '<div class="week">' + week + '</div>';

  if (intakes.length === 0) {
    html += '<div class="empty"><div class="emoji">💊</div><p>' + (isToday ? "На сегодня приёмов нет" : "В этот день приёмов нет") + '</p>' +
      (meds.length === 0 ? '<p class="hint">Добавь первое лекарство кнопкой «+»</p>' : '') + '</div>';
  }

  intakes.forEach(function (it) {
    var rec = taken[it.key], isTaken = !!rec;
    var soon = isToday && !isTaken && it.time <= nowStr;
    var missed = isPast && !isTaken;
    var doseLine = fmtN(it.n) + " шт" + (it.med.doseNote ? " · " + esc(it.med.doseNote) : "");
    var cardCls = (isTaken ? " taken" : missed ? " missed" : soon ? " soon" : "") +
      (it.key === highlightKey && !isTaken ? " flash" : "");

    var btn;
    if (isFuture) {
      btn = '<button class="pill-btn locked" tabindex="-1" aria-hidden="true"><span class="pill-shape" style="background:' + esc(it.med.color) + '"></span></button>';
    } else {
      btn = '<button class="pill-btn' + (isTaken ? " done" : "") + (justTaken === it.key ? " popping" : "") + '" tabindex="-1" aria-hidden="true">' +
        (isTaken ? '<span class="check">✓</span>' : '<span class="pill-shape" style="background:' + esc(it.med.color) + '"></span>') +
        '</button>';
    }

    var status;
    if (isTaken) status = '<div class="status taken-at">' + (rec.retro ? "отмечено позже" : "выпил в " + esc(rec.at)) + '</div>';
    else if (isFuture) status = '<div class="status">запланировано</div>';
    else if (missed) status = '<div class="status miss">пропущено — нажми, если пил</div>';
    else status = '<div class="status">' + (soon ? "пора!" : "позже") + '</div>';

    html +=
      '<div class="card' + cardCls + '" data-key="' + esc(it.key) + '"' +
        (!isFuture ? ' data-take="' + esc(it.key) + '" role="button" aria-label="' +
          (isTaken ? "Принято, нажми чтобы отменить" : "Отметить приём: " + esc(it.med.name)) + '"' : '') + '>' +
        btn +
        '<div class="info">' +
          '<div class="med-name">' + esc(it.med.name) + '</div>' +
          '<div class="med-dose">' + doseLine + '</div>' +
          (isToday && holderOf(it.med).stock <= 5 && !isTaken ? '<div class="low-badge">Осталось ' + fmtN(holderOf(it.med).stock) + ' шт — пора купить</div>' : '') +
        '</div>' +
        '<div class="right"><div class="time' + (soon ? " soon" : "") + '">' + esc(it.time) + '</div>' + status + '</div>' +
      '</div>';
  });
  return html;
}

// ─── Экран «Мои лекарства» ───
function renderMeds() {
  var html = '<h1 style="margin-bottom:16px">Мои лекарства</h1>';

  if (notifInfo.supported) {
    var ok = notifInfo.exact === "granted";
    html += '<div class="card" style="display:block; border-color:' + (ok ? "var(--line)" : "var(--coral)") + '">' +
      '<div style="font-weight:800; font-size:15px; margin-bottom:4px">🔔 Напоминания</div>' +
      '<div style="font-size:13.5px; color:var(--mute); font-weight:600">' +
        (notifInfo.count > 0
          ? "Запланировано: " + notifInfo.count +
            (notifInfo.next ? "<br>Ближайшее: " + esc(notifInfo.next) : "")
          : "Ничего не запланировано — проверь время и дни у лекарств") +
      '</div>' +
      (!ok ? '<div style="font-size:13px; color:var(--coral); font-weight:700; margin-top:8px">' +
        'Точные будильники запрещены — уведомления будут опаздывать или не приходить</div>' : '') +
      '<div class="med-actions">' +
        (!ok ? '<button class="btn-small danger" id="fix-exact">Разрешить будильники</button>' : '') +
        '<button class="btn-small primary" id="resync">Перепроверить</button>' +
      '</div>' +
    '</div>';
  }

  var lins = [];
  meds.forEach(function (m) { if (lins.indexOf(linOf(m)) === -1) lins.push(linOf(m)); });
  var shown = 0;

  lins.forEach(function (lin) {
    var act = activeVersions(lin);
    if (!act.length) return;           // лекарство закончилось — остаётся только в истории
    shown++;
    var m = act[0];                    // действующая версия
    var next = act[1];                 // запланированная замена, если есть
    var h = holderOf(m), low = h.stock <= 5;
    var timesTxt = m.times.map(function (x) { return x.t + " (" + fmtN(x.n) + " шт)"; }).join(", ");
    var shortDate = function (k) { return parseKey(k).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }); };

    html +=
      '<div class="card" style="display:block">' +
        '<div style="display:flex; align-items:center; gap:10px">' +
          '<span class="pill-shape" style="width:30px; height:16px; background:' + esc(m.color) + '; flex-shrink:0"></span>' +
          '<div style="flex:1">' +
            '<div class="med-name">' + esc(m.name) + '</div>' +
            '<div style="font-size:13.5px; color:var(--mute); font-weight:600">' +
              timesTxt + ' · ' + schedText(m) +
              (m.start > dateKey() ? ' · с ' + shortDate(m.start) : '') +
              ' · ' + remindText(m) +
              (m.doseNote ? ' · ' + esc(m.doseNote) : '') +
              (m.courseDays ? ' · курс ' + m.courseDays + ' дн.' : ' · постоянно') +
            '</div>' +
          '</div>' +
        '</div>' +

        (next ? '<div style="margin-top:10px; background:var(--green-soft); border-radius:14px; padding:10px 12px">' +
          '<div style="font-size:13px; font-weight:800; color:var(--green)">С ' + shortDate(next.start) + ' — запланировано изменение</div>' +
          '<div style="font-size:13px; color:var(--mute); font-weight:600; margin-top:2px">' +
            esc(next.name) + ' · ' + next.times.map(function (x) { return x.t + " (" + fmtN(x.n) + ")"; }).join(", ") + ' · ' + schedText(next) +
          '</div>' +
          '<button class="link-btn" data-cancelnext="' + lin + '" style="margin-top:6px">Отменить изменение</button>' +
        '</div>' : '') +

        '<div style="margin-top:12px">' +
          '<div class="stock-row"><span style="color:var(--mute)">Запас</span>' +
            '<span style="color:' + (low ? "var(--coral)" : "var(--green)") + '">' + fmtN(h.stock) + ' из ' + h.pack + ' шт</span></div>' +
          '<div class="stock-bar' + (low ? " low" : "") + '"><div style="width:' + Math.min(100, (h.stock / h.pack) * 100) + '%"></div></div>' +
        '</div>' +
        '<div class="med-actions">' +
          '<button class="btn-small primary" data-edit="' + m.id + '">Изменить</button>' +
          '<button class="btn-small primary" data-refill="' + h.id + '">Купил +' + h.pack + '</button>' +
          '<button class="btn-small danger" data-del="' + lin + '">Удалить</button>' +
        '</div>' +
      '</div>';
  });

  if (shown === 0) {
    html += '<div class="empty"><div class="emoji">💊</div><p>Список пуст</p><p class="hint">Добавь лекарство кнопкой «+»</p></div>';
  }
  return html;
}

// ─── Экран «Добавить» ───
var form = null;
function blankForm() {
  return { editId: null, name: "", doseNote: "", times: [{ t: "09:00", n: 1 }], mode: "weekly",
           days: [0,1,2,3,4,5,6], every: 2, start: dateKey(), remindOffsets: [0],
           pack: 30, forever: true, courseN: 14, applyMode: "now", applyFrom: dateKey(new Date(Date.now() + 86400000)) };
}
function formFromMed(m) {
  var h = holderOf(m);
  return {
    editId: m.id, name: m.name, doseNote: m.doseNote || "",
    times: m.times.map(function (x) { return { t: x.t, n: x.n }; }),
    mode: m.mode, days: m.days.slice(), every: m.every, start: m.start,
    remindOffsets: (m.remindOffsets || []).slice(), pack: h.pack,
    forever: !m.courseDays, courseN: m.courseDays || 14,
    applyMode: "now", applyFrom: dateKey(new Date(Date.now() + 86400000)),
  };
}
function renderAdd() {
  var f = form;
  var editing = !!f.editId;
  var editingFuture = editing && f.start > dateKey(); // ещё не начатое лекарство правим целиком

  var html = '<h1 style="font-size:24px">' + (editing ? "Изменить лекарство" : "Новое лекарство") + '</h1>' +
    '<p class="sub" style="margin-bottom:0">' + (editing ? "Меняй что нужно и сохрани" : "Пара шагов — и напоминания готовы") + '</p>' +
    '<label>Название</label>' +
    '<input class="inp" id="f-name" value="' + esc(f.name) + '" placeholder="Например, Витамин C">' +

    '<label>Время и количество на приём</label>';
  f.times.forEach(function (tm, i) {
    html += '<div class="time-row">' +
      '<input type="time" class="inp t f-time" data-i="' + i + '" value="' + esc(tm.t) + '">' +
      '<input type="text" inputmode="decimal" class="inp n f-n" data-i="' + i + '" value="' + fmtN(tm.n) + '" placeholder="шт">' +
      (f.times.length > 1 ? '<button class="del f-del" data-i="' + i + '" aria-label="Убрать время">✕</button>' : '') +
    '</div>';
  });
  html += '<button class="link-btn" id="f-addtime">+ добавить время</button>' +
    '<p class="hint-line">Можно дробное: 0,5 — полтаблетки. Например: 09:00 — 2 шт и 21:00 — 0,5 шт</p>' +

    '<label>Расписание</label>' +
    '<div class="chips2">' +
      '<button class="chip' + (f.mode === "weekly" ? " on" : "") + '" id="f-weekly">По дням недели</button>' +
      '<button class="chip' + (f.mode === "interval" ? " on" : "") + '" id="f-interval">Интервалом</button>' +
    '</div>';

  if (f.mode === "weekly") {
    html += '<div class="day-chips" style="margin-top:8px">' + DAY_NAMES.map(function (d, i) {
      return '<button class="day-chip' + (f.days.indexOf(i) !== -1 ? " on" : "") + '" data-day="' + i + '">' + d + '</button>';
    }).join("") + '</div>';
  } else {
    html += '<input type="number" min="1" class="inp" id="f-every" value="' + f.every + '" style="margin-top:8px">' +
      '<p class="hint-line">1 — каждый день, 2 — через день, 3 — каждые 3 дня… Отсчёт с сегодняшнего дня.</p>';
  }

  html += (!editing || editingFuture
    ? '<label>Дата начала</label>' +
      '<input type="date" class="inp" id="f-start" value="' + esc(f.start) + '">' +
      '<p class="hint-line">' + (f.mode === "interval"
        ? "Для схемы «через день» задаёт точку отсчёта — поставь завтрашнюю дату, если начинаешь с завтра."
        : "До этой даты приёмов и напоминаний не будет.") + '</p>'
    : '') +

    '<label>Напоминания</label>' +
    '<div class="chips-wrap">' + REMIND_OPTS.map(function (o) {
      return '<button class="chip' + (f.remindOffsets.indexOf(o.v) !== -1 ? " on" : "") + '" data-remind="' + o.v + '">' + o.l + '</button>';
    }).join("") + '</div>' +
    '<p class="hint-line">Можно выбрать несколько. Если ничего не выбрано — напоминаний не будет. После отметки «выпил» оставшиеся напоминания этого приёма не приходят.</p>' +

    '<label>Примечание (необязательно)</label>' +
    '<input class="inp" id="f-note" value="' + esc(f.doseNote) + '" placeholder="Например: после еды, запить водой">' +

    '<label>Длительность</label>' +
    '<div class="chips2">' +
      '<button class="chip' + (f.forever ? " on" : "") + '" id="f-forever">Постоянно</button>' +
      '<button class="chip' + (!f.forever ? " on" : "") + '" id="f-course">Курсом</button>' +
    '</div>' +
    (!f.forever ? '<input type="number" min="1" class="inp" id="f-coursen" value="' + f.courseN + '" style="margin-top:8px" placeholder="Сколько дней">' : '') +

    '<label>Сколько штук в упаковке</label>' +
    '<input type="number" min="1" class="inp" id="f-pack" value="' + f.pack + '">' +

    (editing && !editingFuture
      ? '<label>Когда применить изменения</label>' +
        '<div class="chips2">' +
          '<button class="chip' + (f.applyMode === "now" ? " on" : "") + '" id="f-now">Сразу</button>' +
          '<button class="chip' + (f.applyMode === "from" ? " on" : "") + '" id="f-from">С даты</button>' +
        '</div>' +
        (f.applyMode === "from"
          ? '<input type="date" class="inp" id="f-applyfrom" min="' + dateKey(new Date(Date.now() + 86400000)) + '" value="' + esc(f.applyFrom) + '" style="margin-top:8px">' +
            '<p class="hint-line">До этой даты всё останется по-старому, история приёмов сохранится.</p>'
          : '<p class="hint-line">Правки применятся ко всем дням, включая прошедшие. Подходит для опечаток; если меняешь расписание — выбери «С даты».</p>')
      : '') +

    '<button class="btn-main" id="f-save"' + (formValid() ? '' : ' disabled') + '>' + (editing ? "Сохранить изменения" : "Сохранить") + '</button>' +
    '<button class="btn-ghost" id="f-cancel">Отмена</button>';
  return html;
}
function formValid() {
  return form.name.trim() && (form.mode === "interval" || form.days.length > 0);
}

// ─── Рендер и события ───
var el = document.getElementById("screen");
var fab = document.getElementById("fab");
var nav = document.getElementById("nav");

function render() {
  if (screen === "today") el.innerHTML = renderToday();
  else if (screen === "meds") el.innerHTML = renderMeds();
  else if (screen === "people") el.innerHTML = renderPeople();
  else if (screen === "person") el.innerHTML = renderPerson();
  else if (screen === "add") el.innerHTML = renderAdd();

  fab.style.display = screen === "add" ? "none" : "block";
  nav.style.display = screen === "add" ? "none" : "flex";
  nav.querySelectorAll("button").forEach(function (b) {
    b.classList.toggle("active", b.dataset.nav === screen);
  });
  bindEvents();
}

function readForm() {
  var g = function (id) { return document.getElementById(id); };
  if (g("f-name")) form.name = g("f-name").value;
  if (g("f-note")) form.doseNote = g("f-note").value;
  document.querySelectorAll(".f-time").forEach(function (inp) { form.times[+inp.dataset.i].t = inp.value || "09:00"; });
  document.querySelectorAll(".f-n").forEach(function (inp) { form.times[+inp.dataset.i].n = num(inp.value); });
  if (g("f-every")) form.every = Math.max(1, +g("f-every").value || 1);
  if (g("f-start")) form.start = g("f-start").value || dateKey();
  if (g("f-applyfrom")) form.applyFrom = g("f-applyfrom").value || form.applyFrom;
  if (g("f-pack")) form.pack = Math.max(1, +g("f-pack").value || 30);
  if (g("f-coursen")) form.courseN = Math.max(1, +g("f-coursen").value || 14);
}

function bindEvents() {
  // Выбор дня в недельной ленте
  el.querySelectorAll("[data-date]").forEach(function (cell) {
    cell.onclick = function () { selectedKey = cell.dataset.date; render(); };
  });
  var back = document.getElementById("back-today");
  if (back) back.onclick = function () { selectedKey = dateKey(); render(); };

  // Отметка приёма / отмена (сегодня и прошлые дни)
  el.querySelectorAll("[data-take]").forEach(function (btn) {
    btn.onclick = function () {
      var key = btn.dataset.take;
      var medId = +key.split("@")[0];
      var taken = loadTakenFor(selectedKey);
      var med = meds.find(function (m) { return m.id === medId; });
      var tm = med ? med.times.find(function (x) { return med.id + "@" + x.t === key; }) : null;
      var n = tm ? tm.n : 1;
      var stockId = med ? holderOf(med).id : medId;

      if (taken[key]) {
        if (!confirm("Отменить отметку о приёме?")) return;
        delete taken[key];
        meds = meds.map(function (m) { return m.id === stockId ? Object.assign({}, m, { stock: round2(m.stock + n) }) : m; });
        justTaken = null;
      } else {
        var retro = selectedKey < dateKey();
        var atTime = hhmm(new Date());
        taken[key] = retro ? { at: atTime, retro: true } : { at: atTime };
        meds = meds.map(function (m) { return m.id === stockId ? Object.assign({}, m, { stock: Math.max(0, round2(m.stock - n)) }) : m; });
        justTaken = key;
        if (highlightKey === key) highlightKey = null;
        setTimeout(function () { justTaken = null; }, 700);
        if (navigator.vibrate) navigator.vibrate(30);
        var prof = curProfile();
        if (prof.share && med) {
          var intake = { key: key, time: tm ? tm.t : "", n: n, med: med };
          setTimeout(function () { shareText(takenMessage(prof, intake, atTime, selectedKey)); }, 250);
        }
      }
      saveTakenFor(selectedKey, taken); saveMeds(meds); syncNotifications(); render();
    };
  });

  // Изменить / пополнить / удалить / отменить запланированное изменение
  el.querySelectorAll("[data-edit]").forEach(function (btn) {
    btn.onclick = function () {
      var m = meds.find(function (x) { return x.id === +btn.dataset.edit; });
      if (!m) return;
      form = formFromMed(m); screen = "add"; render();
    };
  });
  el.querySelectorAll("[data-refill]").forEach(function (btn) {
    btn.onclick = function () {
      var id = +btn.dataset.refill;
      meds = meds.map(function (m) { return m.id === id ? Object.assign({}, m, { stock: round2(m.stock + m.pack) }) : m; });
      saveMeds(meds); render();
    };
  });
  el.querySelectorAll("[data-del]").forEach(function (btn) {
    btn.onclick = function () {
      var lin = +btn.dataset.del;
      var m = famOf(lin)[0];
      if (!confirm("Удалить «" + (m ? m.name : "") + "»? История приёмов тоже пропадёт.")) return;
      meds = meds.filter(function (x) { return linOf(x) !== lin; });
      saveMeds(meds); syncNotifications(); render();
    };
  });
  el.querySelectorAll("[data-cancelnext]").forEach(function (btn) {
    btn.onclick = function () {
      var lin = +btn.dataset.cancelnext;
      var act = activeVersions(lin);
      if (act.length < 2) return;
      var keepId = act[0].id, dropIds = act.slice(1).map(function (x) { return x.id; });
      meds = meds.filter(function (x) { return dropIds.indexOf(x.id) === -1; })
                 .map(function (x) { return x.id === keepId ? Object.assign({}, x, { until: null }) : x; });
      saveMeds(meds); syncNotifications(); render();
    };
  });

  var fixBtn = document.getElementById("fix-exact");
  if (fixBtn) fixBtn.onclick = async function () {
    var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (LN && LN.changeExactNotificationSetting) { try { await LN.changeExactNotificationSetting(); } catch (e) {} }
  };
  var resyncBtn = document.getElementById("resync");
  if (resyncBtn) resyncBtn.onclick = function () { syncNotifications(); };

  // Переключение профиля в шапке
  el.querySelectorAll("[data-pid]").forEach(function (btn) {
    btn.onclick = function () {
      curPid = btn.dataset.pid; cfgSet("last_profile", curPid);
      meds = loadMeds(); selectedKey = dateKey(); render();
    };
  });

  // ── Экран «Люди» ──
  el.querySelectorAll("[data-openp]").forEach(function (btn) {
    btn.onclick = function () {
      curPid = btn.dataset.openp; cfgSet("last_profile", curPid);
      meds = loadMeds(); screen = "today"; selectedKey = dateKey(); render();
    };
  });
  el.querySelectorAll("[data-editp]").forEach(function (btn) {
    btn.onclick = function () { personEditId = btn.dataset.editp; screen = "person"; render(); };
  });
  el.querySelectorAll("[data-delp]").forEach(function (btn) {
    btn.onclick = function () {
      var p = profiles.find(function (x) { return x.id === btn.dataset.delp; });
      if (!p || !confirm("Удалить карточку «" + p.name + "» со всеми лекарствами и историей?")) return;
      localStorage.removeItem("meds:" + p.id);
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf("taken:" + p.id + ":") === 0) localStorage.removeItem(k);
      }
      profiles = profiles.filter(function (x) { return x.id !== p.id; });
      saveProfiles(profiles);
      if (curPid === p.id) { curPid = profiles[0].id; cfgSet("last_profile", curPid); meds = loadMeds(); }
      syncNotifications(); render();
    };
  });
  var addP = document.getElementById("add-person");
  if (addP) addP.onclick = function () {
    var name = (prompt("Имя человека (как он назовёт себя у себя в приложении)") || "").trim();
    if (!name) return;
    if (profiles.some(function (x) { return x.name.toLowerCase() === name.toLowerCase(); }))
      return alert("Карточка с таким именем уже есть");
    var p = { id: "p" + Date.now(), name: name.slice(0, 32), self: false,
              remind: false, watch: true, share: false, graceMin: 60 };
    profiles.push(p); saveProfiles(profiles);
    personEditId = p.id; screen = "person"; render();
  };

  var bSave = document.getElementById("backup-save");
  if (bSave) bSave.onclick = async function () {
    await shareText("Резервная копия «Мои таблетки» от " +
      new Date().toLocaleDateString("ru-RU") +
      ". Сохрани это сообщение — по нему данные восстанавливаются.\n\n" + backupMake());
    cfgSet("backup_at", new Date().toLocaleDateString("ru-RU"));
    render();
  };
  var bLoad = document.getElementById("backup-load");
  if (bLoad) bLoad.onclick = function () {
    var t = prompt("Вставь сюда текст резервной копии целиком");
    if (t) backupRestore(t);
  };

  // ── Настройки карточки ──
  if (screen === "person") {
    var p = profiles.find(function (x) { return x.id === personEditId; });
    var back = document.getElementById("person-back");
    if (back) back.onclick = function () { screen = "people"; render(); };
    el.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.onclick = function () {
        var f = btn.dataset.toggle;
        p.name = (document.getElementById("person-name").value || p.name).trim().slice(0, 32) || p.name;
        p[f] = !p[f];
        saveProfiles(profiles); render();
      };
    });
    var save = document.getElementById("person-save");
    if (save) save.onclick = function () {
      var nm = (document.getElementById("person-name").value || "").trim().slice(0, 32);
      if (nm) p.name = nm;
      var gr = document.getElementById("person-grace");
      if (gr) p.graceMin = Math.min(720, Math.max(5, +gr.value || 60));
      saveProfiles(profiles); syncNotifications(); screen = "people"; render();
    };
    var plan = document.getElementById("person-plan");
    if (plan) plan.onclick = function () {
      var list = medsOf(p.id);
      if (!list.length) return alert("В этой карточке пока нет лекарств");
      shareText("Моё расписание приёма лекарств.\nОткрой ссылку — карточка «" + p.name +
                "» создастся автоматически:\n\n" + planLink(p, list));
    };
  }

  // Форма добавления
  if (screen === "add") {
    var g = function (id) { return document.getElementById(id); };
    ["f-name", "f-note"].forEach(function (id) {
      g(id).oninput = function () { readForm(); g("f-save").disabled = !formValid(); };
    });
    document.querySelectorAll(".f-time,.f-n").forEach(function (inp) { inp.onchange = readForm; });
    g("f-pack").onchange = readForm;
    if (g("f-every")) g("f-every").onchange = readForm;
    if (g("f-start")) g("f-start").onchange = readForm;
    if (g("f-applyfrom")) g("f-applyfrom").onchange = readForm;
    if (g("f-now")) g("f-now").onclick = function () { readForm(); form.applyMode = "now"; render(); };
    if (g("f-from")) g("f-from").onclick = function () { readForm(); form.applyMode = "from"; render(); };
    document.querySelectorAll("[data-remind]").forEach(function (btn) {
      btn.onclick = function () {
        readForm();
        var v = +btn.dataset.remind, at = form.remindOffsets.indexOf(v);
        if (at === -1) form.remindOffsets.push(v); else form.remindOffsets.splice(at, 1);
        form.remindOffsets.sort(function (a, b) { return a - b; });
        render();
      };
    });
    if (g("f-coursen")) g("f-coursen").onchange = readForm;
    g("f-addtime").onclick = function () { readForm(); form.times.push({ t: "21:00", n: form.times[0].n }); render(); };
    document.querySelectorAll(".f-del").forEach(function (btn) {
      btn.onclick = function () { readForm(); form.times.splice(+btn.dataset.i, 1); render(); };
    });
    document.querySelectorAll("[data-day]").forEach(function (btn) {
      btn.onclick = function () {
        readForm();
        var i = +btn.dataset.day, at = form.days.indexOf(i);
        if (at === -1) form.days.push(i); else form.days.splice(at, 1);
        form.days.sort(function (a, b) { return a - b; });
        render();
      };
    });
    g("f-weekly").onclick = function () { readForm(); form.mode = "weekly"; render(); };
    g("f-interval").onclick = function () { readForm(); form.mode = "interval"; render(); };
    g("f-forever").onclick = function () { readForm(); form.forever = true; render(); };
    g("f-course").onclick = function () { readForm(); form.forever = false; render(); };
    g("f-save").onclick = function () {
      readForm();
      if (!formValid()) return;
      var fields = {
        name: form.name.trim(), doseNote: form.doseNote.trim(),
        times: form.times.map(function (x) { return { t: x.t, n: x.n }; }),
        mode: form.mode, days: form.days.slice(), every: form.every,
        remindOffsets: form.remindOffsets.slice(),
        courseDays: form.forever ? null : form.courseN,
      };

      if (!form.editId) {
        // Новое лекарство
        var newId = Date.now();
        meds.push(Object.assign({ id: newId, lineage: newId, until: null,
          start: form.start || dateKey(), stock: form.pack, pack: form.pack,
          color: PILL_COLORS[Math.floor(Math.random() * PILL_COLORS.length)] }, fields));
      } else {
        var old = meds.find(function (x) { return x.id === form.editId; });
        var holder = holderOf(old);
        // Упаковка/запас общие для всех версий — обновляем сразу
        if (form.pack !== holder.pack) {
          meds = meds.map(function (x) { return x.id === holder.id ? Object.assign({}, x, { pack: form.pack }) : x; });
        }
        var editingFuture = old.start > dateKey();

        if (form.applyMode === "from" && !editingFuture) {
          // Новая версия с выбранной даты, старая закрывается этим днём
          var from = form.applyFrom;
          var lin = linOf(old);
          // убираем ранее запланированные версии этой линейки, начинающиеся не раньше from
          meds = meds.filter(function (x) { return !(linOf(x) === lin && x.id !== old.id && x.start >= from); });
          meds = meds.map(function (x) { return x.id === old.id ? Object.assign({}, x, { until: from }) : x; });
          meds.push(Object.assign({ id: Date.now(), lineage: lin, until: null, start: from,
            stock: 0, pack: form.pack, color: old.color }, fields));
        } else {
          // Правка на месте
          meds = meds.map(function (x) {
            return x.id === old.id
              ? Object.assign({}, x, fields, editingFuture ? { start: form.start || x.start } : {})
              : x;
          });
        }
      }
      saveMeds(meds); syncNotifications();
      screen = form.editId ? "meds" : "today";
      selectedKey = dateKey(); render();
    };
    g("f-cancel").onclick = function () { screen = form.editId ? "meds" : "today"; render(); };
  }
}

// ─── Обмен без сервера: системное «Поделиться» и ссылки ───
// Ничего никуда не отправляется само. Сообщение отправляет сам человек,
// своим мессенджером, тому, кому считает нужным.

function b64e(s) {
  var bytes = new TextEncoder().encode(s), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function shareText(text) {
  var Sh = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
  try {
    if (Sh) { await Sh.share({ text: text, dialogTitle: "Отправить близкому" }); return true; }
    if (navigator.share) { await navigator.share({ text: text }); return true; }
  } catch (e) { return false; }        // пользователь закрыл окно выбора — это не ошибка
  try { await navigator.clipboard.writeText(text); alert("Скопировано — вставь в мессенджер"); return true; }
  catch (e) { alert(text); return true; }
}

// Сообщение об отметке приёма
function takenMessage(prof, it, atTime, dateK) {

             "&t=" + it.time + "&at=" + atTime;

// Ссылка с расписанием — чтобы у близкого карточка совпала один в один
function planLink(prof, medsList) {
  var payload = { n: prof.name, m: medsList.map(function (m) {
    return { id: m.id, lineage: m.lineage, name: m.name, doseNote: m.doseNote,
             times: m.times, mode: m.mode, days: m.days, every: m.every,
             start: m.start, until: m.until, courseDays: m.courseDays,
             remindOffsets: m.remindOffsets, pack: m.pack, stock: m.stock, color: m.color };
  }) };
  return "medapp://plan?d=" + b64e(JSON.stringify(payload));
}

// ─── Приём входящих ссылок ───
function applyTakenLink(params) {
  var pname = params.get("p") || "", dateK = params.get("d") || dateKey();
  var key = params.get("k") || "", time = params.get("t") || "", at = params.get("at") || "";
  var prof = profiles.find(function (p) { return p.name.toLowerCase() === pname.toLowerCase(); });
  if (!prof) {
    alert("Нет карточки «" + pname + "». Создай её на вкладке «Люди» — и ссылки начнут отмечаться сами.");
    screen = "people"; render(); return;
  }
  var taken = takenOf(prof.id, dateK);
  var list = medsOf(prof.id);
  // точное совпадение по ключу приёма, иначе — по плановому времени
  var hit = key;
  if (!list.some(function (m) { return m.times.some(function (x) { return m.id + "@" + x.t === key; }); })) {
    var byTime = null;
    list.forEach(function (m) {
      m.times.forEach(function (x) { if (x.t === time && !byTime) byTime = m.id + "@" + x.t; });
    });
    hit = byTime || key;
  }
  taken[hit] = { at: at || hhmm(new Date()), via: "link" };
  localStorage.setItem("taken:" + prof.id + ":" + dateK, JSON.stringify(taken));
  curPid = prof.id; cfgSet("last_profile", curPid);
  meds = loadMeds(); screen = "today"; selectedKey = dateK;
  syncNotifications(); render();
  if (navigator.vibrate) navigator.vibrate(30);
}

function applyPlanLink(params) {
  var raw = params.get("d");
  if (!raw) return;
  var data;
  try { data = JSON.parse(b64d(raw)); } catch (e) { return alert("Не удалось прочитать ссылку с расписанием"); }
  var name = (data.n || "Близкий").slice(0, 32);
  var prof = profiles.find(function (p) { return p.name.toLowerCase() === name.toLowerCase(); });
  if (prof) {
    if (!confirm("Обновить расписание в карточке «" + prof.name + "»?")) return;
  } else {
    if (!confirm("Создать карточку «" + name + "» с её расписанием?")) return;
    prof = { id: "p" + Date.now(), name: name, self: false,
             remind: false, watch: true, share: false, graceMin: 60 };
    profiles.push(prof); saveProfiles(profiles);
  }
  localStorage.setItem("meds:" + prof.id, JSON.stringify(data.m || []));
  curPid = prof.id; cfgSet("last_profile", curPid);
  meds = loadMeds(); screen = "today"; selectedKey = dateKey();
  syncNotifications(); render();
}

function handleUrl(url) {
  if (!url) return;
  var q = url.indexOf("?");
  var params = new URLSearchParams(q >= 0 ? url.slice(q + 1) : "");
  if (url.indexOf("taken") >= 0) applyTakenLink(params);
  else if (url.indexOf("plan") >= 0) applyPlanLink(params);
}

(function initDeepLinks() {
  var App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) {
    App.addListener("appUrlOpen", function (ev) { handleUrl(ev && ev.url); });
    if (App.getLaunchUrl) App.getLaunchUrl().then(function (r) { if (r && r.url) handleUrl(r.url); }).catch(function () {});
  }
  if (location.search.indexOf("taken") >= 0 || location.search.indexOf("plan") >= 0) handleUrl(location.href);
})();

// ─── Резервная копия ───
// Собирает профили, лекарства и историю в один текст. Хранить можно где угодно —
// отправить себе в мессенджер, сохранить в заметки. Восстановление — вставкой текста.
function backupMake() {
  var dump = { v: 2, at: new Date().toISOString(), profiles: profiles, data: {} };
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && (k.indexOf("meds:") === 0 || k.indexOf("taken:") === 0)) dump.data[k] = localStorage.getItem(k);
  }
  return "МОИ-ТАБЛЕТКИ-КОПИЯ:" + b64e(JSON.stringify(dump));
}

function backupRestore(text) {
  var marker = "МОИ-ТАБЛЕТКИ-КОПИЯ:";
  var at = (text || "").indexOf(marker);
  if (at < 0) { alert("Это не похоже на резервную копию"); return false; }
  var dump;
  try { dump = JSON.parse(b64d(text.slice(at + marker.length).trim())); }
  catch (e) { alert("Копия повреждена — текст скопирован не целиком?"); return false; }
  if (!dump.profiles || !dump.data) { alert("В копии нет данных"); return false; }
  if (!confirm("Восстановить " + dump.profiles.length + " карточек? Текущие данные будут заменены.")) return false;

  for (var i = localStorage.length - 1; i >= 0; i--) {
    var k = localStorage.key(i);
    if (k && (k.indexOf("meds:") === 0 || k.indexOf("taken:") === 0)) localStorage.removeItem(k);
  }
  Object.keys(dump.data).forEach(function (k) { localStorage.setItem(k, dump.data[k]); });
  profiles = dump.profiles; saveProfiles(profiles);
  curPid = profiles[0].id; cfgSet("last_profile", curPid);
  meds = loadMeds(); screen = "today"; selectedKey = dateKey();
  syncNotifications(); render();
  alert("Данные восстановлены");
  return true;
}

// ─── Локальные уведомления (Capacitor) ───
// Планируем конкретные напоминания на 14 дней вперёд (это покрывает и интервальные
// схемы вроде «через день»). Список пересоздаётся при каждом открытии приложения.
async function syncNotifications() {
  var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if (!LN) return;
  try {
    var perm = await LN.requestPermissions();
    if (perm.display !== "granted") return;
    var pending = await LN.getPending();
    if (pending.notifications && pending.notifications.length) {
      await LN.cancel({ notifications: pending.notifications.map(function (n) { return { id: n.id }; }) });
    }
    var notifs = [], id = 1, now = new Date();
    for (var off = 0; off < 14; off++) {
      var d = new Date(); d.setDate(d.getDate() + off);
      var dk = dateKey(d);
      profiles.forEach(function (prof) {
        if (!prof.remind && !prof.watch) return;
        var dayTaken = takenOf(prof.id, dk);
        var who = prof.self ? "" : prof.name + ": ";
        medsOf(prof.id).forEach(function (m) {
          if (!occursOn(m, d)) return;
          m.times.forEach(function (tm) {
            if (dayTaken[m.id + "@" + tm.t]) return;   // уже отмечено — не напоминаем
            var parts = tm.t.split(":");
            var base = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +parts[0], +parts[1], 0);

            if (prof.remind) {
              (m.remindOffsets || []).forEach(function (mins) {
                var when = new Date(base.getTime() - mins * 60000);
                if (when <= now) return;
                notifs.push({
                  id: id++,
                  title: mins > 0 ? "Скоро приём лекарства ⏰" : "Пора принять лекарство 💊",
                  body: who + m.name + " — " + fmtN(tm.n) + " шт" +
                    (mins > 0 ? ", приём в " + tm.t : "") +
                    (m.doseNote ? " (" + m.doseNote + ")" : ""),
                  extra: { pid: prof.id, date: dk, key: m.id + "@" + tm.t },
                  schedule: { at: when, allowWhileIdle: true },
                });
              });
            }

            if (prof.watch) {
              // Сторожевое: если к сроку подтверждения нет — предупредить
              var alarm = new Date(base.getTime() + (prof.graceMin || 60) * 60000);
              if (alarm > now) notifs.push({
                id: id++,
                title: "Приём не подтверждён ⚠️",
                body: prof.name + " не отметил(а) приём в " + tm.t + " — " + m.name,
                extra: { pid: prof.id, date: dk, key: m.id + "@" + tm.t },
                schedule: { at: alarm, allowWhileIdle: true },
              });
            }
          });
        });
      });
    }
    notifs = notifs.slice(0, 450); // запас до системного лимита будильников Android
    if (notifs.length) await LN.schedule({ notifications: notifs });

    // Диагностика для экрана «Лекарства»
    notifInfo.supported = true;
    notifInfo.count = notifs.length;
    if (notifs.length) {
      var soonest = notifs.reduce(function (a, b) { return a.schedule.at < b.schedule.at ? a : b; });
      var w = soonest.schedule.at;
      var dayWord = dateKey(w) === dateKey() ? "сегодня"
        : dateKey(w) === dateKey(new Date(Date.now() + 86400000)) ? "завтра"
        : w.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
      notifInfo.next = dayWord + " в " + hhmm(w);
    } else notifInfo.next = null;
    if (LN.checkExactNotificationSetting) {
      try { notifInfo.exact = (await LN.checkExactNotificationSetting()).exact_alarm; }
      catch (e) { notifInfo.exact = "granted"; }
    } else notifInfo.exact = "granted";
    if (screen === "meds") render();
  } catch (e) { console.warn("notifications:", e); }
}

// Нажатие на уведомление → открываем нужный день и подсвечиваем приём
(function initNotifTap() {
  var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if (!LN) return;
  LN.addListener("localNotificationActionPerformed", function (ev) {
    var x = ev && ev.notification && ev.notification.extra;
    if (!x || !x.key) return;
    if (x.pid && profiles.some(function (p) { return p.id === x.pid; })) {
      curPid = x.pid; cfgSet("last_profile", curPid); meds = loadMeds();
    }
    screen = "today";
    selectedKey = x.date || dateKey();
    highlightKey = x.key;
    render();
    var hl = el.querySelector('[data-key="' + highlightKey + '"]');
    if (hl) hl.scrollIntoView({ block: "center", behavior: "smooth" });
  });
})();

// При возврате в приложение — обновляем экран и перепланируем напоминания
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    if (screen === "today") { selectedKey = dateKey(); render(); }
    syncNotifications();

  }
});

render();
syncNotifications();
</script>
</body>
</html>
